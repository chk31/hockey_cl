<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>アイテムエアホッケー</title>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/* VOICE: 80年代ゲームセンターの筐体。ピコピコ、チカチカ
   IDEA: ブラウン管に映る低解像度のドット絵として3D盤面を刷り直す
   PICTURE: 画面いっぱいの盤面。少ない色数のディザ、走査線、ドット絵のアイテム
   COLOUR/TYPE: 黒い筐体、藍の天板、赤1P #ff3048 / 青2P #2f9bff、黄 #ffe000。Press Start 2P + DotGothic16
   LAYOUT: 長辺がゴール方向。両端に1P/2Pのスコアとアイテム欄 */
:root{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;overflow:hidden;background:#000;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
canvas{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;display:block}
#gl{pointer-events:none;image-rendering:pixelated}#ui{touch-action:none}
.crt{position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(0,0,0,.3) 0 1px,transparent 1px 3px)}
.crt::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 58%,rgba(0,0,0,.6) 100%)}
@media (prefers-reduced-motion:reduce){.crt{background:none}}
</style>
</head>
<body>
<canvas id="gl"></canvas><canvas id="ui"></canvas><div class="crt"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
{
const ui=document.getElementById('ui'),g=ui.getContext('2d'),glc=document.getElementById('gl');
const FW=600,TRAY=110,GUT=48,FL=1000,TL=FL+2*TRAY+2*GUT,FY0=GUT+TRAY,FY1=FY0+FL,MID=FY0+FL/2,GW=200,PR=26,MR=40,MAXV=2100,WIN=7;
const COL=['#ff0055','#00aaff'],DEEP=['#aa0000','#0055aa'],INK='#000',YEL='#ffff00',PX=3;
const PIX='"Press Start 2P",monospace',DOT='"DotGothic16",monospace';
const IT={jump:{n:'ジャンプ台',c:'#ffaa00',r:46},boost:{n:'加速床',c:'#00ffff',r:70},bumper:{n:'バンパー',c:'#aa55ff',r:34},mud:{n:'ぬかるみ',c:'#aa5500',r:72}};
const KEYS=Object.keys(IT);
const fwd=i=>i===0?-1:1,rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>v<a?a:v>b?b:v;
const hash=n=>{const s=Math.sin(n*127.1)*43758.5453;return s-Math.floor(s)};
const snap=(v,q=6)=>Math.round(v/q)*q;
/* テーマ：パック／陣地／エフェクトを個別に選ぶ */
const THEMES={
  puck:[{n:'CLASSIC',b:'#ffffff',r:'#ffff00'},{n:'GOLD',b:'#ffaa00',r:'#ffff55'},{n:'NEON',b:'#00ffff',r:'#ff55ff'},{n:'RUBY',b:'#ff0055',r:'#ffffff'},{n:'SHADOW',b:'#555555',r:'#ffffff'}],
  field:[{n:'CLASSIC',c:['#ff0055','#00aaff'],d:['#aa0000','#0055aa'],h:['#550055','#000055']},
    {n:'SUNSET',c:['#ffaa00','#ff55ff'],d:['#aa5500','#aa00aa'],h:['#550000','#550055']},
    {n:'JUNGLE',c:['#55ff55','#ffff55'],d:['#00aa00','#aaaa00'],h:['#005500','#555500']},
    {n:'OCEAN',c:['#00ffff','#5555ff'],d:['#00aaaa','#0000aa'],h:['#005555','#000055']},
    {n:'MONO',c:['#ffffff','#aaaaaa'],d:['#555555','#555555'],h:['#555555','#000000']}],
  fx:[{n:'ARCADE',spk:['#ffffff','#ffff00','#ffaa00','#ff0055'],tr:['#ff0055','#ffaa00','#ffff00','#00ff55','#00ffff','#aa55ff'],fire:['#ff0055','#ffaa00','#ffff00','#ffffff'],k:1},
    {n:'NEON',spk:['#ffffff','#00ffff','#ff55ff','#5555ff'],tr:['#00ffff','#55ffff','#ff55ff','#aa55ff','#5555ff','#ffffff'],fire:['#ff55ff','#00ffff','#ffffff','#aa55ff'],k:1},
    {n:'MONO',spk:['#ffffff','#aaaaaa','#ffffff','#555555'],tr:['#ffffff','#aaaaaa','#555555','#ffffff','#aaaaaa','#555555'],fire:['#ffffff','#aaaaaa','#ffffff','#555555'],k:1},
    {n:'PASTEL',spk:['#ffffff','#ffb3d9','#fff1a8','#b8f2ff'],tr:['#ffb3d9','#ffd6a5','#fff1a8','#caffbf','#b8f2ff','#d7c4ff'],fire:['#ff8fc7','#ffd6a5','#fff1a8','#ffffff']},
    {n:'CANDY',spk:['#ffffff','#ff5fa2','#ffe066','#7ad7f0'],tr:['#ff5fa2','#ff9f68','#ffe066','#7ee081','#7ad7f0','#b28dff'],fire:['#ff5fa2','#ff9f68','#ffe066','#ffffff']}],
  lv:[{n:'FULL'},{n:'LITE'},{n:'MIN'}],
  st:[{n:'ARCADE'},{n:'KAWAII'}]
};
let TH={puck:0,field:0,fx:0,st:0,lv:0};
const kawaii=()=>TH.st===1;
const lite=()=>TH.lv>=1,minimal=()=>TH.lv===2;
try{const t=JSON.parse(localStorage.getItem('ah_theme')||'{}');for(const k in TH)if(THEMES[k][t[k]])TH[k]=t[k]}catch(e){}
let FXT=THEMES.fx[0],PK=THEMES.puck[0];

let W=0,H=0,dpr=1,rot=false,S=1,OX=0,OY=0;
let state='title',goalT=0,overT=0,lastScorer=0,ts=1,clock=0,flash=0;
const drags=new Map(),fx=[],arm=[null,null];
let placed=[];
const mk=i=>({i,x:FW/2,y:i?FY0+120:FY1-120,vx:0,vy:0,tx:FW/2,ty:i?FY0+120:FY1-120,ptr:null,score:0,items:[],box:{on:false,cd:4,x:0,y:0,spin:0},fl:0,flc:'#fff',fls:-1});
let P=[mk(0),mk(1)];
const puck={x:FW/2,y:MID,vx:0,vy:0,air:0,airT:1,land:0,boostT:0,inMud:false,boom:false,hold:0,side:-1,muddy:0,dropT:0,still:0,trail:[]};
let shake=0,camH=1000,hitstop=0,ab=0,fcol=[1,1,1],rally=0,lastHitter=-1,rallyPop=0,railFlash=0;
const hex=c=>[1,3,5].map(k=>parseInt(c.slice(k,k+2),16)/255);

/* ================= ドット絵アイコン ================= */
const ART={
 jump:['....YYYY....','..YYYYYYYY..','.YYYYWWYYYY.','.YYYWWWWYYY.','YYYWWYYWWYYY','YYWWYYYYWWYY','YYYYYWWYYYYY','YYYYWWWWYYYY','.YYWWYYWWYY.','.YYYYYYYYYY.','..YYYYYYYY..','....YYYY....'],
 boost:['..CCCCCCCC..','..CCCWWCCC..','..CCWWWWCC..','..CWWCCWWC..','..CCCWWCCC..','..CCWWWWCC..','..CWWCCWWC..','..CCCWWCCC..','..CCWWWWCC..','..CWWCCWWC..','..CCCCCCCC..','..CCCCCCCC..'],
 bumper:['....PPPP....','..PPPPPPPP..','.PPPWWWWPPP.','.PPWWWWWWPP.','PPWWWPPWWWPP','PPWWPPPPWWPP','PPWWPPPPWWPP','PPWWWPPWWWPP','.PPWWWWWWPP.','.PPPWWWWPPP.','..PPPPPPPP..','....PPPP....'],
 mud:['............','...BBB..BB..','..BBBBBBBBB.','.BBDBBBBBBB.','.BBBBBBDBBB.','BBBBBBBBBBB.','BBBDBBBBBBBB','.BBBBBBBDBB.','.BBBBBBBBBB.','..BBBDBBBB..','...BBBBBB...','....BB......']
};
const PAL={Y:'#ffaa00',W:'#ffffff',C:'#00ffff',P:'#aa55ff',B:'#aa5500',D:'#550000'};
const SPR={};
for(const k in ART){const cv=document.createElement('canvas');cv.width=cv.height=14;const q=cv.getContext('2d');const a=ART[k];
  q.fillStyle='#000';a.forEach((row,y)=>[...row].forEach((ch,x)=>{if(ch!=='.')q.fillRect(x,y,3,3)}));
  a.forEach((row,y)=>[...row].forEach((ch,x)=>{if(ch!=='.'){q.fillStyle=PAL[ch];q.fillRect(x+1,y+1,1,1)}}));SPR[k]=cv}

/* ================= 3D ================= */
const has3D=!!window.THREE;
let R3,scene,cam,rt,post,postScene,postCam,meshes={},boostTex;
const wx=x=>x-FW/2,wz=y=>y-TL/2;
function redraw(t,fn){const q=t.image.getContext('2d');q.clearRect(0,0,t.image.width,t.image.height);fn(q,t.image.width,t.image.height);t.needsUpdate=true}
function tex(w,h,fn,near){const cv=document.createElement('canvas');cv.width=w;cv.height=h;const q=cv.getContext('2d');q.imageSmoothingEnabled=false;fn(q,w,h);const t=new THREE.CanvasTexture(cv);if(near){t.magFilter=t.minFilter=THREE.NearestFilter}return t}
function build3D(){
  R3=new THREE.WebGLRenderer({canvas:glc,antialias:false});
  R3.setClearColor(0x000000);R3.shadowMap.enabled=true;R3.shadowMap.type=THREE.BasicShadowMap;
  scene=new THREE.Scene();
  cam=new THREE.PerspectiveCamera(45,1,10,6000);
  const grad=new THREE.DataTexture(new Uint8Array([70,70,70,160,160,160,255,255,255]),3,1,THREE.RGBFormat);
  grad.minFilter=grad.magFilter=THREE.NearestFilter;grad.needsUpdate=true;
  const toon=(o)=>new THREE.MeshToonMaterial(Object.assign({gradientMap:grad},o));
  const hullM=new THREE.MeshBasicMaterial({color:0x000000,side:THREE.BackSide});
  const hull=(m,t=4)=>{m.geometry.computeBoundingBox();const b=m.geometry.boundingBox,sz=new THREE.Vector3();b.getSize(sz);
    const h=new THREE.Mesh(m.geometry,hullM);h.scale.set(1+2*t/sz.x,1+2*t/Math.max(sz.y,1),1+2*t/sz.z);m.add(h);return m};
  const sh=m=>{m.castShadow=true;m.receiveShadow=true;return m};
  scene.add(new THREE.AmbientLight(0xffffff,.4));
  const L=new THREE.DirectionalLight(0xffffff,.6);L.position.set(-260,900,340);L.castShadow=true;
  Object.assign(L.shadow.camera,{left:-800,right:800,top:800,bottom:-800,near:100,far:2500});L.shadow.mapSize.set(1024,1024);L.shadow.bias=-.002;
  scene.add(L);
  // 天板：藍地にドットの空気穴、ピクセルのライン
  const drawTable=(q,w,h)=>{const F=THEMES.field[TH.field];
    q.fillStyle=F.h[1];q.fillRect(0,0,w,h/2);q.fillStyle=F.h[0];q.fillRect(0,h/2,w,h/2);
    q.fillStyle='#5555aa';for(let y=3;y<h;y+=6)for(let x=3;x<w;x+=6)q.fillRect(x,y,1,1);
    q.fillStyle='#fff';q.fillRect(0,h/2-1,w,2);
    const ring=(cx,cy,r,c,a0=0,a1=Math.PI*2)=>{q.fillStyle=c;for(let a=a0;a<=a1;a+=.02){q.fillRect(Math.round(cx+Math.cos(a)*r)-1,Math.round(cy+Math.sin(a)*r)-1,2,2)}};
    ring(w/2,h/2,16,'#fff');q.fillRect(w/2-2,h/2-2,4,4);
    ring(w/2,h,GW*.75/5,COL[0],Math.PI,Math.PI*2);ring(w/2,0,GW*.75/5,COL[1],0,Math.PI);
  };
  const tt=tex(FW/5,FL/5,drawTable,true);
  const top=new THREE.Mesh(new THREE.PlaneGeometry(FW,FL).rotateX(-Math.PI/2),toon({map:tt}));top.receiveShadow=true;scene.add(top);
  // レール
  const T=24,RH=24,railMs=[toon({color:0xaaaaaa}),toon({color:COL[0]}),toon({color:COL[1]})];
  const rail=(w,d,x,z,m)=>{const r=sh(hull(new THREE.Mesh(new THREE.BoxGeometry(w,RH,d),m),3));r.position.set(x,RH/2,z);scene.add(r)};
  for(const s of [-1,1]){rail(T,FL/2+T,s*(FW/2+T/2),FL/4+T/2,railMs[1]);rail(T,FL/2+T,s*(FW/2+T/2),-FL/4-T/2,railMs[2])}
  const seg=(FW-GW)/2,sx=GW/2+seg/2;
  for(const [z,m] of [[-FL/2-T/2,railMs[2]],[FL/2+T/2,railMs[1]]])for(const s of [-1,1])rail(seg,T,s*sx,z,m);
  for(const z of [-FL/2-T/2,FL/2+T/2]){const m=new THREE.Mesh(new THREE.BoxGeometry(GW,2,T),new THREE.MeshBasicMaterial({color:0x000000}));m.position.set(0,0,z);scene.add(m)}
  // マレット
  meshes.mallet=P.map((p,i)=>{
    const gr=new THREE.Group();
    const mA=toon({color:COL[i]}),mB=toon({color:DEEP[i]});gr.userData={mA,mB};
    const b=sh(hull(new THREE.Mesh(new THREE.CylinderGeometry(MR,MR,16,24),mA)));b.position.y=8;gr.add(b);
    const r=sh(new THREE.Mesh(new THREE.CylinderGeometry(MR*.62,MR*.7,4,24),mB));r.position.y=17;gr.add(r);
    const n=sh(hull(new THREE.Mesh(new THREE.CylinderGeometry(14,17,34,16),toon({color:0xffffff})),3));n.position.y=34;gr.add(n);
    const c=sh(hull(new THREE.Mesh(new THREE.SphereGeometry(17,16,8),mA),3));c.position.y=52;gr.add(c);
    scene.add(gr);return gr;
  });
  // パック
  const drawPuck=(q)=>{q.fillStyle=PK.b;q.fillRect(0,0,16,16);q.fillStyle=PK.r;for(let a=0;a<6.3;a+=.1)q.fillRect(Math.round(8+Math.cos(a)*5)-1,Math.round(8+Math.sin(a)*5)-1,2,2)};
  const pt=tex(16,16,drawPuck,true);
  const wm=toon({color:PK.b});
  const tm=toon({map:pt});meshes.puckMats=[wm,tm];
  meshes.puck=sh(hull(new THREE.Mesh(new THREE.CylinderGeometry(PR,PR,12,24),[wm,tm,wm])));scene.add(meshes.puck);
  // アイテムボックス
  const boxTex=[];
  meshes.box=P.map((p,i)=>{const drawBox=(q)=>{q.fillStyle=COL[i];q.fillRect(0,0,16,16);q.fillStyle='#000';q.fillRect(0,0,16,1);q.fillRect(0,15,16,1);q.fillRect(0,0,1,16);q.fillRect(15,0,1,16);
      q.fillStyle=YEL;['..YYYY..','.YY..YY.','.....YY.','....YY..','...YY...','...YY...','........','...YY...'].forEach((r,y)=>[...r].forEach((ch,x)=>{if(ch==='Y')q.fillRect(x+4,y+4,1,1)}))};
    const bt=tex(16,16,drawBox,true);boxTex.push([bt,drawBox]);
    const m=sh(hull(new THREE.Mesh(new THREE.BoxGeometry(52,52,52),toon({map:bt}))));m.visible=false;scene.add(m);return m});
  meshes.retheme=()=>{redraw(tt,drawTable);redraw(pt,drawPuck);wm.color.set(PK.b);railMs[1].color.set(COL[0]);railMs[2].color.set(COL[1]);
    meshes.mallet.forEach((gr,i)=>{gr.userData.mA.color.set(COL[i]);gr.userData.mB.color.set(DEEP[i])});boxTex.forEach(([t,f])=>redraw(t,f))};
  // 設置アイテム
  const spriteTex=k=>tex(14,14,(q)=>q.drawImage(SPR[k],0,0),true);
  boostTex=tex(10,10,(q)=>{q.fillStyle=IT.boost.c;q.fillRect(0,0,10,10);q.fillStyle='#fff';
    ['....WW....','...WWWW...','..WW..WW..','.WW....WW.'].forEach((r,y)=>[...r].forEach((ch,x)=>{if(ch==='W')q.fillRect(x,y+3,1,1)}))},true);
  boostTex.wrapT=THREE.RepeatWrapping;
  const decal=(w,h,map,y)=>{const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h).rotateX(-Math.PI/2),toon({map,transparent:true,alphaTest:.5}));m.position.y=y;m.receiveShadow=true;return m};
  const jt=spriteTex('jump'),mt=spriteTex('mud');
  meshes.make={
    jump(){const gr=new THREE.Group(),b=sh(hull(new THREE.Mesh(new THREE.CylinderGeometry(46,50,10,24),toon({color:IT.jump.c}))));b.position.y=5;gr.add(b,decal(92,92,jt,10.6));return gr},
    boost(){const gr=new THREE.Group(),b=sh(hull(new THREE.Mesh(new THREE.BoxGeometry(77,6,140),toon({color:IT.boost.c}))));b.position.y=3;const d=decal(77,140,boostTex,6.6);gr.add(b,d);return gr},
    bumper(){const gr=new THREE.Group();
      const a=sh(hull(new THREE.Mesh(new THREE.CylinderGeometry(34,36,26,20),toon({color:IT.bumper.c}))));a.position.y=13;
      const b=sh(hull(new THREE.Mesh(new THREE.CylinderGeometry(19,19,30,16),toon({color:0xffffff})),3));b.position.y=15;
      const c=sh(new THREE.Mesh(new THREE.CylinderGeometry(9,9,32,12),toon({color:IT.bumper.c})));c.position.y=16;gr.add(a,b,c);return gr},
    mud(){const gr=new THREE.Group();gr.add(decal(160,160,mt,.8));return gr}
  };
  boostTex.repeat.set(1,1.8);
  // ポスト処理：低解像度化＋輪郭線＋ディザで減色
  rt=new THREE.WebGLRenderTarget(4,4,{minFilter:THREE.NearestFilter,magFilter:THREE.NearestFilter});
  post=new THREE.ShaderMaterial({uniforms:{t:{value:rt.texture},lo:{value:new THREE.Vector2(4,4)},slow:{value:0},flash:{value:0},ab:{value:0},fc:{value:new THREE.Vector3(1,1,1)}},
    vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}',
    fragmentShader:`precision highp float;uniform sampler2D t;uniform vec2 lo;uniform float slow,flash,ab;uniform vec3 fc;varying vec2 vUv;
    float b2(vec2 a){a=floor(a);return fract(dot(a,vec2(.5,a.y*.75)));}
    float b4(vec2 a){return b2(.5*a)*.25+b2(a);}
    void main(){
      vec2 px=floor(vUv*lo)+.5,uv=px/lo,d=1./lo;
      vec3 c=vec3(texture2D(t,uv+vec2(ab*4.*d.x,0.)).r,texture2D(t,uv).g,texture2D(t,uv-vec2(ab*4.*d.x,0.)).b);
      vec3 k=vec3(.3,.59,.11);float l=dot(c,k);
      float n1=dot(texture2D(t,uv+vec2(d.x,0.)).rgb,k),n2=dot(texture2D(t,uv-vec2(d.x,0.)).rgb,k),n3=dot(texture2D(t,uv+vec2(0.,d.y)).rgb,k),n4=dot(texture2D(t,uv-vec2(0.,d.y)).rgb,k);
      float line=step(.3,max(max(n1,n2),max(n3,n4))-l);
      c=mix(c,vec3(l),slow*.6)*(1.-slow*.3);
      c=mix(c,fc,flash);
      float n=3.;c=clamp(floor(c*n+b4(px)),0.,n)/n;
      gl_FragColor=vec4(mix(c,vec3(0.),line*.85),1.);
    }`,depthTest:false,depthWrite:false});
  postScene=new THREE.Scene();postCam=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
  postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),post));
}
function render3D(){
  const lift=puck.air>0?Math.sin(Math.PI*(1-puck.air/puck.airT)):0;
  P.forEach((p,i)=>meshes.mallet[i].position.set(wx(p.x),0,wz(p.y)));
  const pm=meshes.puck;pm.visible=!puck.boom;
  { // 持ちすぎ警告：赤く明滅（残りが減るほど速く）
    const rem=HOLD-puck.hold,on=state==='play'&&rem<3&&Math.sin(clock*Math.PI*2*(2+(3-rem)*3))>0;
    for(const m of meshes.puckMats)m.emissive.set(on?0xff0000:0x000000);
  }
  pm.position.set(wx(puck.x),6+lift*380-(puck.inMud?7:0),wz(puck.y));pm.scale.setScalar(1+lift*.5);
  if(puck.inMud)pm.rotation.z=Math.sin(clock*25)*.25;else pm.rotation.z=0;
  pm.rotation.x=lift*.5*Math.sign(puck.vy||1);
  P.forEach((p,i)=>{const m=meshes.box[i],b=p.box;m.visible=b.on;if(b.on){m.position.set(wx(b.x),40+Math.round(Math.sin(clock*4)*2)*3,wz(b.y));m.rotation.set(.5,Math.round(b.spin*4)/4,.3)}});
  for(const it of placed){
    if(it.mesh)it.mesh.position.y=!minimal()&&it.age<.22?Math.pow(1-it.age/.22,2)*420:0;
    if(!it.mesh){it.mesh=meshes.make[it.type]();it.mesh.position.set(wx(it.x),0,wz(it.y));it.mesh.rotation.y=it.type==='boost'?Math.atan2(-it.dx,-it.dy):(it.o===1?Math.PI:0);scene.add(it.mesh)}
    const left=it.life-it.age,pop=it.age<.22?1:1,s=pop*(1+it.hit*.6);
    const sy=it.age<.22?1:it.type==='jump'&&it.hit>0?(it.hit>.22?.35:1+it.hit*4):1+it.hit;it.mesh.scale.set(s,sy,s);it.mesh.visible=left>2||Math.floor(it.age*8)%2===0;
  }
  boostTex.offset.y=-Math.floor(clock*20%10)/10;
  post.uniforms.slow.value=1-ts;post.uniforms.flash.value=flash;post.uniforms.ab.value=ab;post.uniforms.fc.value.set(fcol[0],fcol[1],fcol[2]);
  const sx=(hash(clock*61)-.5)*shake,sz=(hash(clock*37+3)-.5)*shake;cam.position.set(sx,camH,sz);cam.lookAt(sx,0,sz);
  R3.setRenderTarget(rt);R3.render(scene,cam);R3.setRenderTarget(null);R3.render(postScene,postCam);
}
function drop(it){if(it.mesh&&scene)scene.remove(it.mesh)}

function applyTheme(){
  const F=THEMES.field[TH.field];COL[0]=F.c[0];COL[1]=F.c[1];DEEP[0]=F.d[0];DEEP[1]=F.d[1];
  FXT=THEMES.fx[TH.fx];PK=THEMES.puck[TH.puck];
  if(has3D&&meshes.retheme)meshes.retheme();
  try{localStorage.setItem('ah_theme',JSON.stringify(TH))}catch(e){}
}
/* ================= 画面とタッチ座標 ================= */
function resize(){
  dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  ui.width=W*dpr;ui.height=H*dpr;rot=W>H;

    if(l.u>56&&l.u<136){TH[key]=(TH[key]+n-1)%n;applyTheme();beep(520,.04)}else if(l.u>464&&l.u<544){TH[key]=(TH[key]+1)%n;applyTheme();beep(780,.04)}});
  if(l.v>OK_Y&&l.v<OK_Y+52&&l.u>200&&l.u<400){state='title';beep(880,.05)}
}
function circle(x,y,r,c){g.fillStyle=c;g.beginPath();g.arc(x,y,r,0,7);g.fill()}
function drawOptions(){
  g.fillStyle='rgba(0,0,0,.6)';g.fillRect(-40,FY0,FW+80,FL);
  frame(0,()=>{pbox(36,OY0,FW-72,484,COL[0]);ptext('OPTION',FW/2,OY0+30,18,YEL);
    OPT_ROWS.forEach((key,k)=>{const y=rowY(k),t=THEMES[key][TH[key]];
      ptext(OPT_LBL[key],FW/2,y+4,9,'#888');
      for(const [x,ch] of [[56,'<'],[464,'>']]){pbox(x,y+12,80,50,'#666');ptext(ch,x+40,y+38,18,'#fff')}
      ptext(t.n,FW/2,y+28,13,'#fff');
      const py=y+52;
      if(key==='puck'){circle(FW/2,py,12,'#000');circle(FW/2,py,10,t.b);g.strokeStyle=t.r;g.lineWidth=3;g.beginPath();g.arc(FW/2,py,6,0,7);g.stroke()}
      else if(key==='field'){[0,1].forEach(j=>{g.fillStyle='#000';g.fillRect(FW/2-46+j*48,py-9,44,18);g.fillStyle=t.h[1-j];g.fillRect(FW/2-44+j*48,py-7,40,14);g.fillStyle=t.c[j];g.fillRect(FW/2-36+j*48,py-4,24,8)})}
      else if(key==='st'){if(TH.st){ks('heart',FW/2-30,py,16,FXT.tr[0]);ks('star',FW/2,py,18,FXT.tr[2]);ks('spark',FW/2+30,py,16,'#fff')}else for(let j=0;j<3;j++){sq(FW/2-30+j*30,py,14,'#000');sq(FW/2-30+j*30,py,10,FXT.spk[j+1])}}
      else if(key==='fx')t.spk.concat(t.tr.slice(0,2)).forEach((c,j)=>sq(FW/2-50+j*20,py,j%2?9:12,c));
      else for(let j=0;j<5;j++)sq(FW/2-40+j*20,py,6,j<[5,2,1][TH.lv]?'#fff':'#333');
    });
    pbox(200,OK_Y,200,52,blink(2)?YEL:'#fff','#1a1a1a');ptext('OK',FW/2,OK_Y+28,18,'#fff');
  });
  frame(1,()=>{pbox(36,TY0+110,FW-72,120,COL[1]);ptext('AIR HOCKEY',FW/2,TY0+172,34,YEL)});
}
function drawUI(){
  g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,ui.width,ui.height);base();
  if(!has3D){g.fillStyle='#16206a';g.fillRect(0,FY0,FW,FL);P.forEach(p=>sq(p.x,p.y,MR*2,COL[p.i]));sq(puck.x,puck.y,PR*2,'#fff');
    P.forEach(p=>{if(p.box.on)sq(p.box.x,p.box.y,52,COL[p.i])});placed.forEach(it=>spr(it.type,it.x,it.y,IT[it.type].r*2,fwd(it.o)))}
  trail();
  landMark();
  if(state==='play'&&!puck.boom&&puck.hold>HOLD-3){const rem=HOLD-puck.hold,n=20,lit=Math.ceil(n*rem/3),R=PR+20,warn=rem<1;
    for(let k=0;k<n;k++){const a=-Math.PI/2+k/n*6.2832,x=puck.x+Math.cos(a)*R,y=puck.y+Math.sin(a)*R;if(k<lit){sq(x,y,10,'#000');sq(x,y,7,warn&&blink(10)?'#ff0055':(k%2?'#fff':YEL))}}
    frame(puck.side,()=>{const l=local(puck.side,puck.x,puck.y);ptext(String(Math.ceil(rem)),l.u,l.v-PR-42,22,warn?'#ff0055':'#fff')});}
  slowRays();
  for(const f of fx)if(f.k!=='text')drawFx(f);
  marquee();
  P.forEach(tray);
  ghosts();
  for(const f of fx)if(f.k==='text')drawFx(f);
  if(state==='title'){
    g.fillStyle='rgba(0,0,0,.6)';g.fillRect(-40,FY0,FW+80,FL);
    frame(0,()=>{pbox(36,TY0,FW-72,300,COL[0]);
      ptext('AIR HOCKEY',FW/2,TY0+58,34,YEL);
      BTN.forEach(b=>{const y=btnY(b),hl=b.m!=='opt'&&b.m===mode&&(b.l==null||b.l===lvl);pbox(b.x,y,b.w,BH,hl?(blink(2)?YEL:'#fff'):'#666',hl?'#1a1a1a':'#000');
        if(b.m==='2p')ptext('2P',b.x+b.w/2,y+BH/2+2,20,'#fff');
        else if(b.m==='opt')ptext('OPTION',b.x+b.w/2,y+BH/2+2,14,'#fff');
        else{ptext('CPU',b.x+b.w/2,y+26,16,'#fff');for(let k=0;k<3;k++){const px=b.x+b.w/2+(k-1)*22;g.fillStyle='#000';g.fillRect(px-8,y+46,16,12);g.fillStyle=k<=b.l?[YEL,'#ffaa00','#ff0055'][b.l]:'#333';g.fillRect(px-6,y+48,12,8)}}});
    });
    frame(1,()=>{pbox(36,TY0+110,FW-72,120,COL[1]);ptext('AIR HOCKEY',FW/2,TY0+172,34,YEL)});
  }else if(state==='options'){drawOptions();
  }else if(state==='goal'){
    for(const i of [0,1])frame(i,()=>{if(i===lastScorer){const RBW=FXT.tr;const sc=1+Math.max(0,goalT-1.8)*2.5;g.save();g.translate(FW/2,MID+190+Math.sin(clock*12)*6);g.scale(sc,sc);ptext('GOAL!!',0,0,64,RBW[Math.floor(clock*16)%6]);if(kawaii())for(let k=0;k<6;k++){const a=clock*3+k*1.047;ks(k%2?'heart':'star',Math.cos(a)*190,Math.sin(a)*60,22,RBW[k])}g.restore()}});
  }else if(state==='over'){
    g.fillStyle='rgba(0,0,0,.6)';g.fillRect(-40,FY0,FW+80,FL);
    const win=P[0].score>=WIN?0:1;
    for(const i of [0,1])panel(i,[{t:i===win?(mode==='cpu'&&i===1?'CPU WIN!':'YOU WIN!'):'GAME OVER',y:56,s:i===win?36:32,c:i===win?YEL:'#888'},
      {t:`${P[i].score} - ${P[1-i].score}`,y:120,s:30,c:COL[i]},{t:overT>1.5?'▶':'',y:186,s:22,f:DOT,blink:true}],i===win?COL[i]:'#555');
  }
}
let last=performance.now();
function loop(t){
  const dt=Math.min(.033,Math.max(.001,(t-last)/1000));last=t;
  try{if(hitstop>0){hitstop-=dt;clock+=dt*.2}else update(dt);shake*=Math.exp(-dt*9);ab=Math.max(0,ab-dt*4);railFlash=Math.max(0,railFlash-dt);rallyPop=Math.max(0,rallyPop-dt);if(has3D)render3D();drawUI()}catch(err){console.error(err)}
  requestAnimationFrame(loop);
}
applyTheme();if(has3D){build3D();applyTheme()}
addEventListener('resize',resize);resize();
if(document.fonts&&document.fonts.load){document.fonts.load('20px "Press Start 2P"');document.fonts.load('20px DotGothic16')}
requestAnimationFrame(loop);
}
</script>
