/* VOICE: 80年代ゲームセンターの筐体。ピコピコ、チカチカ
   IDEA: ブラウン管に映る低解像度のドット絵として3D盤面を刷り直す
   PICTURE: 画面いっぱいの盤面。少ない色数のディザ、走査線、ドット絵のアイテム
   COLOUR/TYPE: 黒い筐体、藍の天板、赤1P #ff3048 / 青2P #2f9bff、黄 #ffe000。Press Start 2P + DotGothic16
   LAYOUT: 長辺がゴール方向。両端に1P/2Pのスコアとアイテム欄 */
:root{color-scheme:dark;--sat:env(safe-area-inset-top,0px);--sar:env(safe-area-inset-right,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px)}
#sa{position:fixed;visibility:hidden;pointer-events:none;top:0;left:0;padding:var(--sat) var(--sar) var(--sab) var(--sal)}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;overflow:hidden;touch-action:none;background:#000;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
canvas{position:fixed;left:0;top:0;width:100%;height:100%;display:block} /* 実際の表示サイズを描画・タッチ判定の基準にする（iOSのホーム画面起動で innerHeight とずれるため） */
#gl{pointer-events:none;image-rendering:pixelated}#ui{touch-action:none}
.crt{position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(0,0,0,.3) 0 1px,transparent 1px 3px)}
.crt::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 58%,rgba(0,0,0,.6) 100%)}
@media (prefers-reduced-motion:reduce){.crt{background:none}}

<script>
{
const ui=document.getElementById('ui'),g=ui.getContext('2d'),glc=document.getElementById('gl');
const VER='1.79'; // バージョン（更新のたびに上げる。タイトル画面の右下に表示）
/* 新しい版の確認：起動時とアプリに戻ったときに、キャッシュを使わずに公開中のページの版を読み、新しければタイトル画面で読み込み直す（別のURLにして古いキャッシュを避ける） */
function verCheck(){try{fetch(location.pathname+'?vc='+Date.now(),{cache:'no-store'}).then(r=>r.text()).then(t=>{const m=t.match(/<meta name="version" content="([0-9.]+)">/);
  if(!m||+m[1]<=+VER)return;const go=()=>{const q=new URLSearchParams(location.search);if(q.get('v')===m[1])return;q.set('v',m[1]);location.replace(location.pathname+'?'+q)};
  const w=()=>{if(typeof state==='undefined'||state==='title')go();else setTimeout(w,1000)};w()}).catch(()=>{})}catch(e){}}
setTimeout(verCheck,1500);document.addEventListener('visibilitychange',()=>{if(!document.hidden)verCheck()});
const FW=600,TRAY=110,GUT=48,FL=1000,TL=FL+2*TRAY+2*GUT,FY0=GUT+TRAY,FY1=FY0+FL,MID=FY0+FL/2,GW=220,PR=26,MR=40,MAXV=1680,WIN=7; // MAXV＝パックの最高速（v1.37 で旧ゲームスピード0.8倍を基準＝100%に。パックの速さの値はすべて旧値の0.8倍）
/* 差し込み口（ローグライク版 rogue/rogue.js が書き換える。本体だけなら初期値のまま＝今と同じ動き）
   RULE.win＝勝ちの点数。プレイヤーごと：P[i].mr＝マレットの半径、P[i].hm＝打ったパックの速さの倍率、P[i].boxK＝箱の出る間隔の倍率、P[i].lifeK＝置いた物の持続の倍率、P[i].parK＝パリィ受付の倍率、P[i].iw＝アイテムの出やすさ。WB.t＝上のゴールを左右に広げる幅。SLOTS＝アイテム欄の数。置いた物の it.aim＝ジャンプ台が相手のゴールへ向けて飛ばす。P[1].parFrz＝パリィの停止中に CPU を完全に止める */
const RULE={win:WIN,ev:null}; // ev＝差し込み口：ジャンプ台・加速床にパックが触れたとき ev('jump'|'boost', 置物) を呼ぶ（ローグ版の得点計算用）
const mrOf=i=>P[i]&&P[i].mr||MR;
const COL=['#ff0055','#00aaff'],DEEP=['#aa0000','#0055aa'],INK='#000',YEL='#ffff00',PX=3;
const PIX='"Press Start 2P",monospace',DOT='"DotGothic16",monospace';
const IT={jump:{n:'ジャンプ台',c:'#ffaa00',r:46},boost:{n:'加速床',c:'#00ffff',r:70},bumper:{n:'バンパー',c:'#aa55ff',r:34},mud:{n:'ぬかるみ',c:'#55ff55',r:72},super:{n:'スーパーシュート',c:'#33ccff',r:40}};
const KEYS=Object.keys(IT);
/* アイテムボックスから出るアイテムの重み（0〜10）。開発者画面の GAME で変更でき端末に保存。オンラインはホストの値 */
const IW={};KEYS.forEach(k=>IW[k]=5);
try{const v=JSON.parse(localStorage.getItem('ah_items')||'{}');KEYS.forEach(k=>{if(v[k]>=0&&v[k]<=10)IW[k]=Math.round(v[k])})}catch(e){}
function setIW(k,v){IW[k]=Math.max(0,Math.min(10,v));try{localStorage.setItem('ah_items',JSON.stringify(IW))}catch(e){}}
function pickItem(p){const W=p&&p.iw||IW,tot=KEYS.reduce((a,k)=>a+W[k],0);if(tot<=0)return KEYS[Math.floor(Math.random()*KEYS.length)];let r=Math.random()*tot;for(const k of KEYS){r-=W[k];if(r<0)return k}return KEYS[KEYS.length-1]}
const fwd=i=>i===0?-1:1,rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>v<a?a:v>b?b:v;
const hash=n=>{const s=Math.sin(n*127.1)*43758.5453;return s-Math.floor(s)};
const snap=(v,q=6)=>Math.round(v/q)*q;
/* テーマ：パック／陣地／エフェクトを個別に選ぶ */

  field:[{n:'CLASSIC',c:['#ff0055','#00aaff'],d:['#aa0000','#0055aa'],h:['#550055','#000055']},
    {n:'SUNSET',c:['#ffaa00','#ff55ff'],d:['#aa5500','#aa00aa'],h:['#550000','#550055']},
    {n:'JUNGLE',c:['#55ff55','#ffff55'],d:['#00aa00','#aaaa00'],h:['#005500','#555500']},
    {n:'OCEAN',c:['#00ffff','#5555ff'],d:['#00aaaa','#0000aa'],h:['#005555','#000055']},
    {n:'MONO',c:['#ffffff','#aaaaaa'],d:['#555555','#555555'],h:['#555555','#000000']}],
  fx:[{n:'ARCADE',spk:['#ffffff','#ffff00','#ffaa00','#ff0055'],tr:['#ff0055','#ffaa00','#ffff00','#00ff55','#00ffff','#aa55ff'],fire:['#ff0055','#ffaa00','#ffff00','#ffffff'],k:1},
    {n:'NEON',spk:['#ffffff','#00ffff','#ff55ff','#5555ff'],tr:['#00ffff','#55ffff','#ff55ff','#aa55ff','#5555ff','#ffffff'],fire:['#ff55ff','#00ffff','#ffffff','#aa55ff'],k:1},
    {n:'MONO',spk:['#ffffff','#aaaaaa','#ffffff','#555555'],tr:['#ffffff','#aaaaaa','#555555','#ffffff','#aaaaaa','#555555'],fire:['#ffffff','#aaaaaa','#ffffff','#555555'],k:1},
    {n:'PASTEL',spk:['#ffffff','#ffb3d9','#fff1a8','#b8f2ff'],tr:['#ffb3d9','#ffd6a5','#fff1a8','#caffbf','#b8f2ff','#d7c4ff'],fire:['#ff8fc7','#ffd6a5','#fff1a8','#ffffff']},
    {n:'CANDY',spk:['#ffffff','#ff5fa2','#ffe066','#7ad7f0'],tr:['#ff5fa2','#ff9f68','#ffe066','#7ee081','#7ad7f0','#b28dff'],fire:['#ff5fa2','#ff9f68','#ffe066','#ffffff']},
    // DIGITAL：白 #FFFFFF／青 #0000FF／灰 #8A8883 の3色＋明るい青1色（暗い盤面で青が沈まないように）
    {n:'DIGITAL',spk:['#ffffff','#0000ff','#8a8883','#5c5cff'],tr:['#ffffff','#0000ff','#8a8883','#ffffff','#0000ff','#5c5cff'],fire:['#ffffff','#0000ff','#8a8883','#ffffff']},
    // CLAUDE：テラコッタ系のオレンジ、クリーム、ウォームグレーの暖色パレット
    {n:'CLAUDE',spk:['#f0eee6','#d97757','#c15f3c','#b0aea5'],tr:['#d97757','#e8a07f','#f0eee6','#c15f3c','#b0aea5','#f5c4a8'],fire:['#d97757','#c15f3c','#f0eee6','#ffffff']},
    // NULL：端末の緑（明るい緑・薄い緑・深い緑）＋エラーの赤と橙。ボス「NULL」の色
    {n:'NULL',spk:['#c8ffd8','#3dff7a','#23c45e','#ff3355'],tr:['#3dff7a','#23c45e','#c8ffd8','#3dff7a','#1f9a4a','#c8ffd8'],fire:['#ff3355','#ff8a3d','#3dff7a','#ffffff'],lock:1,goal:'#3dff7a'}],
  lv:[{n:'FULL'},{n:'LITE'},{n:'MIN'}],
  st:[{n:'ARCADE'},{n:'KAWAII'},{n:'WEB90'},{n:'CLAUDE'},{n:'NULL',lock:1}] // NULL：記号でできたエフェクト（ボス撃破で OPTION に出る）
};
let TH={puck:0,field:0,fx:0,st:0,lv:0};
let TH2={st:0,fx:0}; // 同じ端末の2P：上側（2P）のエフェクトの STYLE と COLOR（OPTION の 2P タブ）
const NULLFX={st:4,fx:7}; // ボスのエフェクト
/* エフェクトはそれぞれ出した人の設定で描く。o＝0（下・1P）／1（上・2P）。ボス戦の2P側＝NULL、オンラインの相手＝相手の設定、2P対戦の上側＝TH2 */
function sideFX(o){if(o!==0&&o!==1)return TH;
  if(BOSS&&BOSS.on)return o===1?NULLFX:TH;
  if(mode==='online'&&NET.open){const me=NET.role==='guest'?1:0;return o===me?TH:(NET.oth||TH)}
  if(mode==='2p')return o===1?TH2:TH;
  return TH}
function withSide(o,fn){const st=TH.st,fx=FXT,S=sideFX(o);if(S===TH)return fn();TH.st=S.st;FXT=THEMES.fx[S.fx]||FXT;try{return fn()}finally{TH.st=st;FXT=fx}}
const kawaii=()=>TH.st===1;
const nullS=()=>TH.st===4; // NULL：{}[]/01 などの記号が飛び散る・流れる・噴き上がる（impact / smash / goal だけ専用、他は ARCADE）
const claudeS=()=>TH.st===3; // CLAUDE：吹き出し・考え中の「…」・＊のキラキラ（impact / smash / goal だけ専用、他は ARCADE）
const web90=()=>TH.st===2; // 90年代Web風：Win95の立体ボタン／ポップアップ窓・虹色のライン・キラキラGIF・マーチングアンツ・工事中テープ・矢印カーソル
const lite=()=>TH.lv>=1,minimal=()=>TH.lv===2;
try{const t=JSON.parse(localStorage.getItem('ah_theme')||'{}');for(const k in TH)if(THEMES[k][t[k]])TH[k]=t[k]}catch(e){}
TH2={st:TH.st,fx:TH.fx};try{const t=JSON.parse(localStorage.getItem('ah_theme2')||'null');if(t){if(THEMES.st[t.st])TH2.st=t.st;if(THEMES.fx[t.fx])TH2.fx=t.fx}}catch(e){}
let FXT=THEMES.fx[0],PK=THEMES.puck[0];
/* パックの速さ（OPTION の PUCK SPEED バー）：50〜150%（100%＝旧ゲームスピード0.8倍）。パックの動き（移動・減速・空中時間・加速）だけがこの倍率で進み、
   タイマー（4秒ルール・アイテムの寿命・スタン等）・マレット・CPU は実時間のまま。オンラインはホストの設定が両者に適用される */
const SPD_MIN=.5,SPD_MAX=1.5,SPD_N=Math.round((SPD_MAX-SPD_MIN)*10)+1;
let SPD=1;try{const v=parseFloat(localStorage.getItem('ah_speed2'));if(v>=SPD_MIN&&v<=SPD_MAX)SPD=Math.round(v*10)/10}catch(e){}
function setSpeed(v){SPD=clamp(Math.round(v*10)/10,SPD_MIN,SPD_MAX);try{localStorage.setItem('ah_speed2',String(SPD))}catch(e){}}

let W=0,H=0,dpr=1,rot=false,S=1,OX=0,OY=0,VX=0,VY=0;
let state='title',goalT=0,overT=0,lastScorer=0,ts=1,clock=0,flash=0;
const drags=new Map(),fx=[],arm=[null,null];
let placed=[];
const mk=i=>({i,x:FW/2,y:i?FY0+120:FY1-120,vx:0,vy:0,tx:FW/2,ty:i?FY0+120:FY1-120,ptr:null,score:0,items:[],box:{on:false,cd:4,x:0,y:0,spin:0},fl:0,flc:'#fff',fls:-1,pw:false,stun:0,fx:null,fy:null});
let P=[mk(0),mk(1)];
const puck={x:FW/2,y:MID,vx:0,vy:0,air:0,airT:1,land:0,boostT:0,inMud:false,boom:false,hold:0,side:-1,muddy:0,dropT:0,still:0,trail:[]};
let shake=0,camH=1000,hitstop=0,ab=0,fcol=[1,1,1],rally=0,lastHitter=-1,rallyPop=0,railFlash=0;
const hex=c=>[1,3,5].map(k=>parseInt(c.slice(k,k+2),16)/255);

/* ================= ドット絵アイコン ================= */
const ART={
 jump:['....YYYY....','..YYYYYYYY..','.YYYYWWYYYY.','.YYYWWWWYYY.','YYYWWYYWWYYY','YYWWYYYYWWYY','YYYYYWWYYYYY','YYYYWWWWYYYY','.YYWWYYWWYY.','.YYYYYYYYYY.','..YYYYYYYY..','....YYYY....'],
 boost:['..CCCCCCCC..','..CCCWWCCC..','..CCWWWWCC..','..CWWCCWWC..','..CCCWWCCC..','..CCWWWWCC..','..CWWCCWWC..','..CCCWWCCC..','..CCWWWWCC..','..CWWCCWWC..','..CCCCCCCC..','..CCCCCCCC..'],
 bumper:['....PPPP....','..PPPPPPPP..','.PPPWWWWPPP.','.PPWWWWWWPP.','PPWWWPPWWWPP','PPWWPPPPWWPP','PPWWPPPPWWPP','PPWWWPPWWWPP','.PPWWWWWWPP.','.PPPWWWWPPP.','..PPPPPPPP..','....PPPP....'],
 super:['....UUUU....','..UUUWWUUU..','.UUWWWUUUUU.','.UWWUUUUWWU.','UUUUUUUUWWUU','UUWWUUUUUUUU','NUWWUUUUUUUN','.NNNNNNNNNN.','....SSSS....','....SSSS....','...SSSSSS...','...SSSSSS...'],
 mud:['............','....GGGG....','..GGGGGGGG..','.GGWWGGGGGG.','.GGWGGGGGGG.','GGGGGGGGGHGG','GGGGGGGGGGGG','GGGGHGGGGGHG','.GGGGGGGHHG.','.GG.GGGG.HG.','.G..GGGG..G.','.G...GG...G.']
};
const PAL={Y:'#ffaa00',W:'#ffffff',C:'#00ffff',P:'#aa55ff',B:'#aa5500',D:'#550000',G:'#55ff55',H:'#00aa00',L:'#aaffaa',U:'#3399ff',N:'#0044aa',S:'#ffddaa'};
const ART_HI={mud:['........................','.........GGGGGG.........','......GGGGGGGGGGGG......','....GGGGGGGGGGGGGGGG....','...GGLLWWGGGGGGGGGGGG...','..GGLWWWLGGGGGGGGGGGGG..','..GGLWWLGGGGGGGGGLGGGG..','.GGGGLLGGGGGGGGGGGGGGGG.','.GGGGGGGGGGGGGGGGGGGHGG.','GGGGGGGGGGLLGGGGGGGGGHGG','GGGGGGGGGLWLGGGGGGGGGHGG','GGGLGGGGGGLGGGGGGGGGHHGG','GGGGGGGGGGGGGGGGGGGHHHGG','GGGGGGGGGGGGGGGGHHHHHGGG','.GGGGHGGGGGGGGGGHHHGGGG.','.GGGGHHGGGGGGGGHHHGGGGG.','..GGGGHHHHHHHHHHGGGGGG..','..GGG.GGHHHHHHGGG.GGGG..','...GG..GGGGGGGGG..GGG...','...GH...GGGGGGG...GHG...','...GH....GGHGG....GH....','....H.....GHG.....GH....','..........GH.......H....','...........H............']}; // 床とゴースト用の細かい版（1ドットの大きさを他の床アイテムに揃える）
const SPR={};
for(const k in ART){const cv=document.createElement('canvas');cv.width=cv.height=14;const q=cv.getContext('2d');const a=ART[k];
  q.fillStyle='#000';a.forEach((row,y)=>[...row].forEach((ch,x)=>{if(ch!=='.')q.fillRect(x,y,3,3)}));
  a.forEach((row,y)=>[...row].forEach((ch,x)=>{if(ch!=='.'){q.fillStyle=PAL[ch];q.fillRect(x+1,y+1,1,1)}}));SPR[k]=cv}
const SPR_HI={};
{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=24;c.getContext('2d').drawImage(im,0,0,24,24,0,0,24,24);SPR_HI.mud=c};im.src='fx/slime.png'} // ドラッグ中のゴーストも床と同じ絵に
for(const k in ART_HI){const a=ART_HI[k],n=a.length+2,cv=document.createElement('canvas');cv.width=cv.height=n;const q=cv.getContext('2d');
  q.fillStyle='#000';a.forEach((row,y)=>[...row].forEach((ch,x)=>{if(ch!=='.')q.fillRect(x,y,3,3)}));
  a.forEach((row,y)=>[...row].forEach((ch,x)=>{if(ch!=='.'){q.fillStyle=PAL[ch];q.fillRect(x+1,y+1,1,1)}}));SPR_HI[k]=cv}

/* ================= 3D ================= */
const has3D=!!window.THREE;
let R3,scene,cam,rt,post,postScene,postCam,meshes={},boostTex;
const wx=x=>x-FW/2,wz=y=>y-TL/2;
function redraw(t,fn){const q=t.image.getContext('2d');q.clearRect(0,0,t.image.width,t.image.height);fn(q,t.image.width,t.image.height);t.needsUpdate=true}
function tex(w,h,fn,near){const cv=document.createElement('canvas');cv.width=w;cv.height=h;const q=cv.getContext('2d');q.imageSmoothingEnabled=false;fn(q,w,h);const t=new THREE.CanvasTexture(cv);if(near){t.magFilter=t.minFilter=THREE.NearestFilter}return t}
function build3D(){
  R3=new THREE.WebGLRenderer({canvas:glc,antialias:false});
  R3.setClearColor(0x000000);R3.shadowMap.enabled=true;R3.shadowMap.type=THREE.BasicShadowMap;
  scene=new THREE.Scene();
  cam=new THREE.PerspectiveCamera(45,1,10,6000);
  const grad=new THREE.DataTexture(new Uint8Array([70,70,70,160,160,160,255,255,255]),3,1,THREE.RGBFormat);
  grad.minFilter=grad.magFilter=THREE.NearestFilter;grad.needsUpdate=true;
  const toon=(o)=>new THREE.MeshToonMaterial(Object.assign({gradientMap:grad},o));
  const hullM=new THREE.MeshBasicMaterial({color:0x000000,side:THREE.BackSide});
  const hull=(m,t=4)=>{m.geometry.computeBoundingBox();const b=m.geometry.boundingBox,sz=new THREE.Vector3();b.getSize(sz);
    const h=new THREE.Mesh(m.geometry,hullM);h.scale.set(1+2*t/sz.x,1+2*t/Math.max(sz.y,1),1+2*t/sz.z);m.add(h);return m};
  const sh=m=>{m.castShadow=true;m.receiveShadow=true;return m};
  scene.add(new THREE.AmbientLight(0xffffff,.4));
  const L=new THREE.DirectionalLight(0xffffff,.6);L.position.set(-260,900,340);L.castShadow=true;
  Object.assign(L.shadow.camera,{left:-800,right:800,top:800,bottom:-800,near:100,far:2500});L.shadow.mapSize.set(1024,1024);L.shadow.bias=-.002;
  scene.add(L);
  // 天板：藍地にドットの空気穴、ピクセルのライン
  const drawTable=(q,w,h)=>{const F=THEMES.field[TH.field];
    q.fillStyle=F.h[1];q.fillRect(0,0,w,h/2);q.fillStyle=F.h[0];q.fillRect(0,h/2,w,h/2);
    q.fillStyle='#5555aa';for(let y=3;y<h;y+=6)for(let x=3;x<w;x+=6)q.fillRect(x,y,1,1);
    q.fillStyle='#fff';q.fillRect(0,h/2-1,w,2);
    const ring=(cx,cy,r,c,a0=0,a1=Math.PI*2)=>{q.fillStyle=c;for(let a=a0;a<=a1;a+=.02){q.fillRect(Math.round(cx+Math.cos(a)*r)-1,Math.round(cy+Math.sin(a)*r)-1,2,2)}};
    ring(w/2,h/2,16,'#fff');q.fillRect(w/2-2,h/2-2,4,4);
    ring(w/2,h,GW*.75/5,COL[0],Math.PI,Math.PI*2);ring(w/2,0,GW*.75/5,COL[1],0,Math.PI);
  };
  const tt=tex(FW/5,FL/5,drawTable,true);
  const top=new THREE.Mesh(new THREE.PlaneGeometry(FW,FL).rotateX(-Math.PI/2),toon({map:tt}));top.receiveShadow=true;scene.add(top);

}
function addFx0(k,x,y,s=1,txt='',col=YEL){

  if(lite()){ // LITE：流線・出現・ぬかるみの泡やしずく・小さな火花は出さない。弾け・輪は小さく、弾けは同時2つまで

function down(e){

function bounceOff(px,py,r,e){
  let dx=puck.x-px,dy=puck.y-py,d=Math.hypot(dx,dy);
  if(d>=r+PR)return 0;
  if(d<1e-3){dx=0;dy=puck.y<MID?-1:1;d=1}  // 中心にぴったり重なったときも押し出す
  const nx=dx/d,ny=dy/d;puck.x=px+nx*(r+PR);puck.y=py+ny*(r+PR);
  const vn=puck.vx*nx+puck.vy*ny;if(vn<0){puck.vx-=(1+e)*vn*nx;puck.vy-=(1+e)*vn*ny}
  return Math.max(1,-vn);
}
const POST={fl:[0,0,0,0],t:0}; // ゴールポスト（ゴール口の両端）。当たると光る
function postHit(x,y,v){const k=(x<FW/2?0:1)+(y<MID?0:2);POST.fl[k]=1;const now=performance.now();if(now-POST.t<90||v<60)return;POST.t=now;
  sfx('post',v,x);addFx('impact',x,y,clamp(v/12,30,90),'','');if(v>500)juice(6,.03,.3,.08)}
function wall(x,y,sp){hit(x,y,sp,'',-1,x<=0?[1,0]:x>=FW?[-1,0]:y<=FY0?[0,1]:[0,-1])}
function bumperHit(it,r){
  const v=bounceOff(it.x,it.y,r,1.25);if(v&&puck.sup>=0)breakItem(it); // スーパーシュート：跳ね返したあと壊れる
  if(v&&it.mega&&!it.dead){if(puck.par>=0||puck.boostT>0)it.hp=0;else it.hp--;if(it.hp<=0){breakItem(it);if(!placed.some(q=>q.mega&&!q.dead))bossFlinch(BOSSC.wallFl,'壁がこわれた!')}} // メガバンパー：パリィ・加速ショットなら一発
  if(v){puck.paT=0;if(BOSS.on)puck.lastTouch=-1; // ボス戦：バンパーで跳ね返った球もパリィできる
    const sp=Math.hypot(puck.vx,puck.vy);if(sp<1){const nx=(puck.x-it.x)/(r+PR),ny=(puck.y-it.y)/(r+PR);puck.vx=nx*480;puck.vy=ny*480}else if(sp<480){puck.vx*=480/sp;puck.vy*=480/sp}it.hit=.25;sfx('bump',puck.x);hit(puck.x,puck.y,Math.max(v,400),'');juice(10,.04,.8,.15,'#aa55ff');addFx('wave',it.x,it.y,80,'','#aa55ff')}
  return v;
}
/* スーパーシュートで設置物が壊れる（印を付けて substep の最後に取り除く） */
function breakItem(it){if(it.dead)return;it.dead=true;const c=IT[it.type].c;addFx('impact',it.x,it.y,95,'',c);addFx('wave',it.x,it.y,IT[it.type].r+40,'',c);noise(.25,.12);juice(8,.03,.5,.1,c)}
function sub(h,ms){
  const hp=h*SPD; // パックの時間：ゲームスピードはパックの動き（移動・減速・空中時間・加速）だけに掛かる
  puck.x+=puck.vx*hp;puck.y+=puck.vy*hp;
  if(puck.air>0){puck.air-=hp;if(puck.air<=0){puck.air=0;puck.land=.3;sfx('land',puck.x);juice(16,.06,.8,.2,YEL);addFx('wave',puck.x,puck.y,120,'',YEL);addFx('impact',puck.x,puck.y,60,'','')}}
  const f=Math.exp(-.28*hp);puck.vx*=f;puck.vy*=f;

    if(c>b){const pts=[];for(let x=b;x<=c;x+=8)pts.push([e0+sg*x,FY1+4+Math.floor(hash(x*.37+side)*5)*4]); // ヒビ：レールの上の赤いギザギザ線（黒い縁取り、ときどき白く光る）
      for(const [w,col] of [[9,'#000'],[5,blink(4)?'#ffffff':'#ff3366']])for(let k=1;k<pts.length;k++){const [x0,y0]=pts[k-1],[x1,y1]=pts[k],n=Math.max(1,Math.round(Math.hypot(x1-x0,y1-y0)/4));for(let j=0;j<=n;j++)sq(x0+(x1-x0)*j/n,y0+(y1-y0)*j/n,w,col)}
      for(let k=1;k<pts.length;k+=2){const [x,y]=pts[k];sq(x,y-8,5,'#ff3366');sq(x+sg*4,y+10,5,'#ff3366')} // 枝分かれ
      if(blink(2))ptext('!',e0+sg*(b+(c-b)/2),FY1-18,14,'#ff3366')}
    if(b>0){for(let x=0;x<b;x+=12){sq(e0+sg*(x+6),FY1+2,8,blink(3)?'#ff0055':'#550022')}} // 壊れた所：赤い警告の点線（ここはゴール）
  }
  // 次の技ボックス（前兆）
  {const t=B.tele>0,sh=t?(hash(clock*40)-.5)*8:0,x=BOSS_BOX.x+sh,y=BOSS_BOX.y;
    pbox(x-32,y-32,64,64,t?(blink(10)?YEL:'#fff'):'#ff0055','#000');bossIcon(t?B.teleK:B.next,x,y);
    frame(0,()=>ptext('NEXT',x,y-44,8,t?YEL:'#ff6688'))}
  frame(0,()=>{
    // 上の帯：NULL・段階・HP・書き換え
    g.fillStyle='#000';g.fillRect(-40,-40,FW+80,FY0-26+40);
    ptext('NULL',28,36,24,'#ff0055',PIX,'left');ptext('PHASE '+B.phase+' '+['','コピー','強奪','越境'][B.phase],28,74,12,'#bbb',DOT,'left');
    for(let k=0;k<BOSSC.hp;k++){const x=236+k*32,y=24;pbox(x,y,28,30,'#333',k<B.hp?(B.hp<=BOSSC.ph3?(blink(4)?'#ff0055':'#aa0033'):YEL):'#111')}
    const tags=[];if(SPD!==B.spd0)tags.push('SPEED '+Math.round(SPD*100)+'%');if(B.hold2)tags.push('HOLD '+BOSSC.hold+'s');if(WB.cl||WB.cr)tags.push('WALL '+Math.round((WB.cl+WB.cr)/(2*WSEG)*100)+'%');if(B.tilt)tags.push('TILT');
    tags.forEach((t,k)=>{pbox(236+k*92,66,88,26,'#ff0055','#200');ptext(t,236+k*92+44,80,7,'#fff')});
    if(B.tele>0){ptext('▶ '+BOSS_NAME[B.teleK],FW/2,MID-72,22,'#ff3366',DOT);if(B.hint&&B.teleK==='twin')ptext('当たる直前に指を離すとパリィ！',FW/2,MID+90,18,YEL,DOT)}
    if(B.cap>0)ptext(B.capTxt,FW/2,MID+150,22,B.capTxt==='SAFE!'||B.capTxt.startsWith('RESTORE')?YEL:'#fff',DOT);
    if(B.banner.t>0&&state!=='over'){const a=Math.min(1,B.banner.t*2);g.globalAlpha=a;pbox(70,MID-120,FW-140,150,'#ff0055','#000');ptext(B.banner.a,FW/2,MID-72,30,'#ff0055');ptext(B.banner.b,FW/2,MID-18,26,'#fff',DOT);g.globalAlpha=1}
    if(B.rwT>0){const L=[['PUCK SPEED','100%','→ '+Math.round(BOSSC.spd*100)+'%'],['HOLD (1P)','4.0s','→ '+BOSSC.hold.toFixed(1)+'s']],e=2.2-B.rwT;
      pbox(50,MID-170,FW-100,230,YEL,'#000');ptext('DEV',90,MID-140,12,YEL,PIX,'left');ptext('REWRITTEN BY NULL',FW-80,MID-140,9,'#ff0055',PIX,'right');
      L.forEach((r,k)=>{if(e<.3+k*.5)return;const y=MID-90+k*50;ptext(r[0],80,y,11,'#888',PIX,'left');ptext(r[1],330,y,12,'#fff');if(e>.55+k*.5)ptext(r[2],450,y,12,'#ff0055')});
      if(e>1.4)ptext('RULES UPDATED',FW/2,MID+30,16,blink(6)?'#ff0055':'#fff')}
  });
}
const BO_CONT={x:100,y:MID+110,w:400,h:84},BO_TTL={x:100,y:MID+214,w:400,h:64};
function drawBossOver(){const B=BOSS,W0=2.3; // 勝ったときは撃破の演出（記号の雨）を見せてから画面を出す
  if(B.result==='win'&&overT<W0)return;const overT0=overT,overT2=B.result==='win'?overT-W0:overT;
  g.fillStyle='rgba(0,0,0,'+(.75*Math.min(1,overT2*3))+')';g.fillRect(-40,FY0,FW+80,FL);
  frame(0,()=>{const overT=overT2;
    if(B.result==='win'){ptext('NULL DEFEATED!',FW/2,MID-250,28,YEL);
      ['PUCK SPEED','HOLD','GOAL','TILT','NULL'].forEach((t,k)=>{if(overT<.4+k*.3)return;ptext(t,FW/2-40,MID-190+k*34,12,'#aaa',PIX,'right');ptext('RESET',FW/2+60,MID-190+k*34,12,'#55ff55')});
      if(overT>2){ptext('RULE RESTORED',FW/2,MID+6,22,blink(3)?YEL:'#fff');
        ptext('TIME '+B.time.toFixed(1)+'s'+(B.newBest?'  NEW RECORD!':''),FW/2,MID+64,14,B.newBest?YEL:'#fff');
        ptext('PARRY '+B.parries+'   PARRY GOAL '+B.par2,FW/2,MID+100,12,'#ccc')}
      if(overT>2.6)ptext('タップでタイトルへ',FW/2,MID+170,18,'#fff',DOT)}
    else{ptext('GAME OVER',FW/2,MID-200,34,'#ff0055');ptext('NULL HP '+B.hp+'/'+BOSSC.hp,FW/2,MID-140,14,'#fff');
      ptext('PHASE '+B.phase+' '+['','コピー','強奪','越境'][B.phase],FW/2,MID-104,16,'#aaa',DOT);
      if(overT>1){const r=BO_CONT,plus=B.fails[B.phase]>=2;pbox(r.x,r.y,r.w,r.h,blink(2)?YEL:'#fff','#222');ptext('つづきから',FW/2,r.y+30,24,'#fff',DOT);
        ptext('PHASE '+B.phase+' の最初から'+(plus?'（ライフ+2）':''),FW/2,r.y+62,13,plus?YEL:'#aaa',DOT);
        const q=BO_TTL;pbox(q.x,q.y,q.w,q.h,'#777','#000');ptext('タイトルへ',FW/2,q.y+q.h/2+2,20,'#ccc',DOT)}}
  });
}
function bossOverTap(l){const B=BOSS;if(overT<1)return;
  const toTitle=()=>{state='title';placed.forEach(drop);placed=[];bossOff();beep(660,.06)};
  if(B.result==='win'){if(overT>2.3+2.6)toTitle();return}
  if(inR(l,BO_CONT)){placed.forEach(drop);bossContinue();return}
  if(inR(l,BO_TTL))toTitle()}
function drawAll(){drawUI();if(DIAG)drawDiag()}
let last=performance.now();
function loop(t){
  {const [w,h]=measure();if(w!==W||h!==H)resize()} // 表示サイズが変わっていたら即座に測り直す（タッチ位置のずれ防止）
  const dt=Math.min(.033,Math.max(.001,(t-last)/1000));last=t;
  try{if(hitstop>0){hitstop-=dt;clock+=dt*.2;for(const f of fx)if(f.k==='stop')f.t+=dt}else update(dt);shake*=Math.exp(-dt*9);ab=Math.max(0,ab-dt*4);railFlash=Math.max(0,railFlash-dt);rallyPop=Math.max(0,rallyPop-dt);if(has3D)render3D();drawAll();hostFlush()}catch(err){console.error(err)}
  requestAnimationFrame(loop);
}
applyTheme();if(has3D){build3D();applyTheme()}
addEventListener('resize',resize);resize();
// iOS（特にホーム画面起動）は回転・復帰の直後にサイズの反映が遅れるので、少し遅らせて測り直す
const resizeSoon=()=>{for(const t of [0,120,350,800])setTimeout(resize,t)};
addEventListener('orientationchange',resizeSoon);addEventListener('pageshow',resizeSoon);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)resizeSoon()});
if(window.visualViewport)visualViewport.addEventListener('resize',resizeSoon);
if(document.fonts&&document.fonts.load){document.fonts.load('20px "Press Start 2P"');document.fonts.load('20px DotGothic16')}
requestAnimationFrame(loop);
// 開発・テスト用（?debug のときだけ）：状態の参照と論理座標→画面座標
if(/[?&]debug/.test(location.search))window.__AH={get SPD(){return SPD},get cpu(){return cpu},get TH(){return TH},POST,BOSS,WB,SUP,get PAR(){return PAR},get hitstop(){return hitstop},get shake(){return shake},hit:(...a)=>hit(...a),NET,LOB,get P(){return P},puck,get arm(){return arm},get drags(){return [...drags.values()]},get placed(){return placed},get state(){return state},get mode(){return mode},get live(){return live},get ts(){return ts},get fx(){return fx},get viewFlip(){return viewFlip},
  scr(x,y){if(viewFlip){x=FW-x;y=TL-y}return rot?{x:VX+OX+y*S,y:VY+OY+(FW-x)*S}:{x:VX+OX+x*S,y:VY+OY+y*S}},give(i,k){P[i].items.push(k)},spawnFx(k,x,y,sc,col,ex){const f=addFx(k,x,y,sc,'',col);if(f&&ex)Object.assign(f,ex);return !!f},setTH(o){Object.assign(TH,o);applyTheme()},rx,pdown,ctl};
