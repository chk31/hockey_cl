<!DOCTYPE html>
<html lang="ja">

<style>
/* VOICE: 80年代ゲームセンターの筐体。ピコピコ、チカチカ
   IDEA: ブラウン管に映る低解像度のドット絵として3D盤面を刷り直す
   PICTURE: 画面いっぱいの盤面。少ない色数のディザ、走査線、ドット絵のアイテム
   COLOUR/TYPE: 黒い筐体、藍の天板、赤1P #ff3048 / 青2P #2f9bff、黄 #ffe000。Press Start 2P + DotGothic16
   LAYOUT: 長辺がゴール方向。両端に1P/2Pのスコアとアイテム欄 */
:root{color-scheme:dark;--sat:env(safe-area-inset-top,0px);--sar:env(safe-area-inset-right,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px)}
#sa{position:fixed;visibility:hidden;pointer-events:none;top:0;left:0;padding:var(--sat) var(--sar) var(--sab) var(--sal)}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;overflow:hidden;touch-action:none;background:#000;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
canvas{position:fixed;left:0;top:0;width:100%;height:100%;display:block} /* 実際の表示サイズを描画・タッチ判定の基準にする（iOSのホーム画面起動で innerHeight とずれるため） */
#gl{pointer-events:none;image-rendering:pixelated}#ui{touch-action:none}
.crt{position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(0,0,0,.3) 0 1px,transparent 1px 3px)}
.crt::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 58%,rgba(0,0,0,.6) 100%)}
@media (prefers-reduced-motion:reduce){.crt{background:none}}
</style>
</head>
<body>
<canvas id="gl"></canvas><canvas id="ui"></canvas><div class="crt"></div><div id="sa"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
<script>
{
const ui=document.getElementById('ui'),g=ui.getContext('2d'),glc=document.getElementById('gl');
const VER='1.39'; // バージョン（更新のたびに上げる。タイトル画面の右下に表示）
const FW=600,TRAY=110,GUT=48,FL=1000,TL=FL+2*TRAY+2*GUT,FY0=GUT+TRAY,FY1=FY0+FL,MID=FY0+FL/2,GW=220,PR=26,MR=40,MAXV=1680,WIN=7; // MAXV＝パックの最高速（v1.37 で旧ゲームスピード0.8倍を基準＝100%に。パックの速さの値はすべて旧値の0.8倍）
const COL=['#ff0055','#00aaff'],DEEP=['#aa0000','#0055aa'],INK='#000',YEL='#ffff00',PX=3;
const PIX='"Press Start 2P",monospace',DOT='"DotGothic16",monospace';
const IT={jump:{n:'ジャンプ台',c:'#ffaa00',r:46},boost:{n:'加速床',c:'#00ffff',r:70},bumper:{n:'バンパー',c:'#aa55ff',r:34},mud:{n:'ぬかるみ',c:'#55ff55',r:72},super:{n:'スーパーシュート',c:'#33ccff',r:40}};
const KEYS=Object.keys(IT);
/* アイテムボックスから出るアイテムの重み（0〜10）。開発者画面の GAME で変更でき端末に保存。オンラインはホストの値 */
const IW={};KEYS.forEach(k=>IW[k]=5);
try{const v=JSON.parse(localStorage.getItem('ah_items')||'{}');KEYS.forEach(k=>{if(v[k]>=0&&v[k]<=10)IW[k]=Math.round(v[k])})}catch(e){}
function setIW(k,v){IW[k]=Math.max(0,Math.min(10,v));try{localStorage.setItem('ah_items',JSON.stringify(IW))}catch(e){}}
function pickItem(){const tot=KEYS.reduce((a,k)=>a+IW[k],0);if(tot<=0)return KEYS[Math.floor(Math.random()*KEYS.length)];let r=Math.random()*tot;for(const k of KEYS){r-=IW[k];if(r<0)return k}return KEYS[KEYS.length-1]}
const fwd=i=>i===0?-1:1,rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>v<a?a:v>b?b:v;
const hash=n=>{const s=Math.sin(n*127.1)*43758.5453;return s-Math.floor(s)};
const snap=(v,q=6)=>Math.round(v/q)*q;
/* テーマ：パック／陣地／エフェクトを個別に選ぶ */
const THEMES={
  puck:[{n:'CLASSIC',b:'#ffffff',r:'#ffff00'},{n:'GOLD',b:'#ffaa00',r:'#ffff55'},{n:'NEON',b:'#00ffff',r:'#ff55ff'},{n:'RUBY',b:'#ff0055',r:'#ffffff'},{n:'SHADOW',b:'#555555',r:'#ffffff'}],
  field:[{n:'CLASSIC',c:['#ff0055','#00aaff'],d:['#aa0000','#0055aa'],h:['#550055','#000055']},
    {n:'SUNSET',c:['#ffaa00','#ff55ff'],d:['#aa5500','#aa00aa'],h:['#550000','#550055']},
    {n:'JUNGLE',c:['#55ff55','#ffff55'],d:['#00aa00','#aaaa00'],h:['#005500','#555500']},
    {n:'OCEAN',c:['#00ffff','#5555ff'],d:['#00aaaa','#0000aa'],h:['#005555','#000055']},
    {n:'MONO',c:['#ffffff','#aaaaaa'],d:['#555555','#555555'],h:['#555555','#000000']}],
  fx:[{n:'ARCADE',spk:['#ffffff','#ffff00','#ffaa00','#ff0055'],tr:['#ff0055','#ffaa00','#ffff00','#00ff55','#00ffff','#aa55ff'],fire:['#ff0055','#ffaa00','#ffff00','#ffffff'],k:1},
    {n:'NEON',spk:['#ffffff','#00ffff','#ff55ff','#5555ff'],tr:['#00ffff','#55ffff','#ff55ff','#aa55ff','#5555ff','#ffffff'],fire:['#ff55ff','#00ffff','#ffffff','#aa55ff'],k:1},
    {n:'MONO',spk:['#ffffff','#aaaaaa','#ffffff','#555555'],tr:['#ffffff','#aaaaaa','#555555','#ffffff','#aaaaaa','#555555'],fire:['#ffffff','#aaaaaa','#ffffff','#555555'],k:1},
    {n:'PASTEL',spk:['#ffffff','#ffb3d9','#fff1a8','#b8f2ff'],tr:['#ffb3d9','#ffd6a5','#fff1a8','#caffbf','#b8f2ff','#d7c4ff'],fire:['#ff8fc7','#ffd6a5','#fff1a8','#ffffff']},
    {n:'CANDY',spk:['#ffffff','#ff5fa2','#ffe066','#7ad7f0'],tr:['#ff5fa2','#ff9f68','#ffe066','#7ee081','#7ad7f0','#b28dff'],fire:['#ff5fa2','#ff9f68','#ffe066','#ffffff']},
    // DIGITAL：白 #FFFFFF／青 #0000FF／灰 #8A8883 の3色＋明るい青1色（暗い盤面で青が沈まないように）
    {n:'DIGITAL',spk:['#ffffff','#0000ff','#8a8883','#5c5cff'],tr:['#ffffff','#0000ff','#8a8883','#ffffff','#0000ff','#5c5cff'],fire:['#ffffff','#0000ff','#8a8883','#ffffff']},
    // CLAUDE：テラコッタ系のオレンジ、クリーム、ウォームグレーの暖色パレット
    {n:'CLAUDE',spk:['#f0eee6','#d97757','#c15f3c','#b0aea5'],tr:['#d97757','#e8a07f','#f0eee6','#c15f3c','#b0aea5','#f5c4a8'],fire:['#d97757','#c15f3c','#f0eee6','#ffffff']}],
  lv:[{n:'FULL'},{n:'LITE'},{n:'MIN'}],
  st:[{n:'ARCADE'},{n:'KAWAII'},{n:'WEB90'},{n:'CLAUDE'}]
};
let TH={puck:0,field:0,fx:0,st:0,lv:0};
const kawaii=()=>TH.st===1;
const claudeS=()=>TH.st===3; // CLAUDE：吹き出し・考え中の「…」・＊のキラキラ（impact / smash / goal だけ専用、他は ARCADE）
const web90=()=>TH.st===2; // 90年代Web風：Win95の立体ボタン／ポップアップ窓・虹色のライン・キラキラGIF・マーチングアンツ・工事中テープ・矢印カーソル
const lite=()=>TH.lv>=1,minimal=()=>TH.lv===2;
try{const t=JSON.parse(localStorage.getItem('ah_theme')||'{}');for(const k in TH)if(THEMES[k][t[k]])TH[k]=t[k]}catch(e){}
let FXT=THEMES.fx[0],PK=THEMES.puck[0];
/* パックの速さ（OPTION の PUCK SPEED バー）：50〜150%（100%＝旧ゲームスピード0.8倍）。パックの動き（移動・減速・空中時間・加速）だけがこの倍率で進み、
   タイマー（4秒ルール・アイテムの寿命・スタン等）・マレット・CPU は実時間のまま。オンラインはホストの設定が両者に適用される */
const SPD_MIN=.5,SPD_MAX=1.5,SPD_N=Math.round((SPD_MAX-SPD_MIN)*10)+1;
let SPD=1;try{const v=parseFloat(localStorage.getItem('ah_speed2'));if(v>=SPD_MIN&&v<=SPD_MAX)SPD=Math.round(v*10)/10}catch(e){}
function setSpeed(v){SPD=clamp(Math.round(v*10)/10,SPD_MIN,SPD_MAX);try{localStorage.setItem('ah_speed2',String(SPD))}catch(e){}}

let W=0,H=0,dpr=1,rot=false,S=1,OX=0,OY=0,VX=0,VY=0;
let state='title',goalT=0,overT=0,lastScorer=0,ts=1,clock=0,flash=0;
const drags=new Map(),fx=[],arm=[null,null];
let placed=[];
const mk=i=>({i,x:FW/2,y:i?FY0+120:FY1-120,vx:0,vy:0,tx:FW/2,ty:i?FY0+120:FY1-120,ptr:null,score:0,items:[],box:{on:false,cd:4,x:0,y:0,spin:0},fl:0,flc:'#fff',fls:-1,pw:false,stun:0,fx:null,fy:null});
let P=[mk(0),mk(1)];
const puck={x:FW/2,y:MID,vx:0,vy:0,air:0,airT:1,land:0,boostT:0,inMud:false,boom:false,hold:0,side:-1,muddy:0,dropT:0,still:0,trail:[]};
let shake=0,camH=1000,hitstop=0,ab=0,fcol=[1,1,1],rally=0,lastHitter=-1,rallyPop=0,railFlash=0;
const hex=c=>[1,3,5].map(k=>parseInt(c.slice(k,k+2),16)/255);

/* ================= ドット絵アイコン ================= */
const ART={
 jump:['....YYYY....','..YYYYYYYY..','.YYYYWWYYYY.','.YYYWWWWYYY.','YYYWWYYWWYYY','YYWWYYYYWWYY','YYYYYWWYYYYY','YYYYWWWWYYYY','.YYWWYYWWYY.','.YYYYYYYYYY.','..YYYYYYYY..','....YYYY....'],
 boost:['..CCCCCCCC..','..CCCWWCCC..','..CCWWWWCC..','..CWWCCWWC..','..CCCWWCCC..','..CCWWWWCC..','..CWWCCWWC..','..CCCWWCCC..','..CCWWWWCC..','..CWWCCWWC..','..CCCCCCCC..','..CCCCCCCC..'],
 bumper:['....PPPP....','..PPPPPPPP..','.PPPWWWWPPP.','.PPWWWWWWPP.','PPWWWPPWWWPP','PPWWPPPPWWPP','PPWWPPPPWWPP','PPWWWPPWWWPP','.PPWWWWWWPP.','.PPPWWWWPPP.','..PPPPPPPP..','....PPPP....'],
 super:['....UUUU....','..UUUWWUUU..','.UUWWWUUUUU.','.UWWUUUUWWU.','UUUUUUUUWWUU','UUWWUUUUUUUU','NUWWUUUUUUUN','.NNNNNNNNNN.','....SSSS....','....SSSS....','...SSSSSS...','...SSSSSS...'],
 mud:['............','....GGGG....','..GGGGGGGG..','.GGWWGGGGGG.','.GGWGGGGGGG.','GGGGGGGGGHGG','GGGGGGGGGGGG','GGGGHGGGGGHG','.GGGGGGGHHG.','.GG.GGGG.HG.','.G..GGGG..G.','.G...GG...G.']
};
const PAL={Y:'#ffaa00',W:'#ffffff',C:'#00ffff',P:'#aa55ff',B:'#aa5500',D:'#550000',G:'#55ff55',H:'#00aa00',L:'#aaffaa',U:'#3399ff',N:'#0044aa',S:'#ffddaa'};
const ART_HI={mud:['........................','.........GGGGGG.........','......GGGGGGGGGGGG......','....GGGGGGGGGGGGGGGG....','...GGLLWWGGGGGGGGGGGG...','..GGLWWWLGGGGGGGGGGGGG..','..GGLWWLGGGGGGGGGLGGGG..','.GGGGLLGGGGGGGGGGGGGGGG.','.GGGGGGGGGGGGGGGGGGGHGG.','GGGGGGGGGGLLGGGGGGGGGHGG','GGGGGGGGGLWLGGGGGGGGGHGG','GGGLGGGGGGLGGGGGGGGGHHGG','GGGGGGGGGGGGGGGGGGGHHHGG','GGGGGGGGGGGGGGGGHHHHHGGG','.GGGGHGGGGGGGGGGHHHGGGG.','.GGGGHHGGGGGGGGHHHGGGGG.','..GGGGHHHHHHHHHHGGGGGG..','..GGG.GGHHHHHHGGG.GGGG..','...GG..GGGGGGGGG..GGG...','...GH...GGGGGGG...GHG...','...GH....GGHGG....GH....','....H.....GHG.....GH....','..........GH.......H....','...........H............']}; // 床とゴースト用の細かい版（1ドットの大きさを他の床アイテムに揃える）
const SPR={};
for(const k in ART){const cv=document.createElement('canvas');cv.width=cv.height=14;const q=cv.getContext('2d');const a=ART[k];
  q.fillStyle='#000';a.forEach((row,y)=>[...row].forEach((ch,x)=>{if(ch!=='.')q.fillRect(x,y,3,3)}));
  a.forEach((row,y)=>[...row].forEach((ch,x)=>{if(ch!=='.'){q.fillStyle=PAL[ch];q.fillRect(x+1,y+1,1,1)}}));SPR[k]=cv}
const SPR_HI={};
{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=24;c.getContext('2d').drawImage(im,0,0,24,24,0,0,24,24);SPR_HI.mud=c};im.src='fx/slime.png'} // ドラッグ中のゴーストも床と同じ絵に
for(const k in ART_HI){const a=ART_HI[k],n=a.length+2,cv=document.createElement('canvas');cv.width=cv.height=n;const q=cv.getContext('2d');
  q.fillStyle='#000';a.forEach((row,y)=>[...row].forEach((ch,x)=>{if(ch!=='.')q.fillRect(x,y,3,3)}));
  a.forEach((row,y)=>[...row].forEach((ch,x)=>{if(ch!=='.'){q.fillStyle=PAL[ch];q.fillRect(x+1,y+1,1,1)}}));SPR_HI[k]=cv}

/* ================= 3D ================= */
const has3D=!!window.THREE;
let R3,scene,cam,rt,post,postScene,postCam,meshes={},boostTex;
const wx=x=>x-FW/2,wz=y=>y-TL/2;
function redraw(t,fn){const q=t.image.getContext('2d');q.clearRect(0,0,t.image.width,t.image.height);fn(q,t.image.width,t.image.height);t.needsUpdate=true}
function tex(w,h,fn,near){const cv=document.createElement('canvas');cv.width=w;cv.height=h;const q=cv.getContext('2d');q.imageSmoothingEnabled=false;fn(q,w,h);const t=new THREE.CanvasTexture(cv);if(near){t.magFilter=t.minFilter=THREE.NearestFilter}return t}
function build3D(){
  R3=new THREE.WebGLRenderer({canvas:glc,antialias:false});
  R3.setClearColor(0x000000);R3.shadowMap.enabled=true;R3.shadowMap.type=THREE.BasicShadowMap;
  scene=new THREE.Scene();
  cam=new THREE.PerspectiveCamera(45,1,10,6000);
  const grad=new THREE.DataTexture(new Uint8Array([70,70,70,160,160,160,255,255,255]),3,1,THREE.RGBFormat);
  grad.minFilter=grad.magFilter=THREE.NearestFilter;grad.needsUpdate=true;
  const toon=(o)=>new THREE.MeshToonMaterial(Object.assign({gradientMap:grad},o));
  const hullM=new THREE.MeshBasicMaterial({color:0x000000,side:THREE.BackSide});
  const hull=(m,t=4)=>{m.geometry.computeBoundingBox();const b=m.geometry.boundingBox,sz=new THREE.Vector3();b.getSize(sz);
    const h=new THREE.Mesh(m.geometry,hullM);h.scale.set(1+2*t/sz.x,1+2*t/Math.max(sz.y,1),1+2*t/sz.z);m.add(h);return m};
  const sh=m=>{m.castShadow=true;m.receiveShadow=true;return m};
  scene.add(new THREE.AmbientLight(0xffffff,.4));
  const L=new THREE.DirectionalLight(0xffffff,.6);L.position.set(-260,900,340);L.castShadow=true;
  Object.assign(L.shadow.camera,{left:-800,right:800,top:800,bottom:-800,near:100,far:2500});L.shadow.mapSize.set(1024,1024);L.shadow.bias=-.002;
  scene.add(L);
  // 天板：藍地にドットの空気穴、ピクセルのライン
  const drawTable=(q,w,h)=>{const F=THEMES.field[TH.field];
    q.fillStyle=F.h[1];q.fillRect(0,0,w,h/2);q.fillStyle=F.h[0];q.fillRect(0,h/2,w,h/2);
    q.fillStyle='#5555aa';for(let y=3;y<h;y+=6)for(let x=3;x<w;x+=6)q.fillRect(x,y,1,1);
    q.fillStyle='#fff';q.fillRect(0,h/2-1,w,2);
    const ring=(cx,cy,r,c,a0=0,a1=Math.PI*2)=>{q.fillStyle=c;for(let a=a0;a<=a1;a+=.02){q.fillRect(Math.round(cx+Math.cos(a)*r)-1,Math.round(cy+Math.sin(a)*r)-1,2,2)}};
    ring(w/2,h/2,16,'#fff');q.fillRect(w/2-2,h/2-2,4,4);
    ring(w/2,h,GW*.75/5,COL[0],Math.PI,Math.PI*2);ring(w/2,0,GW*.75/5,COL[1],0,Math.PI);
  };
  const tt=tex(FW/5,FL/5,drawTable,true);
  const top=new THREE.Mesh(new THREE.PlaneGeometry(FW,FL).rotateX(-Math.PI/2),toon({map:tt}));top.receiveShadow=true;scene.add(top);
  // レール
  const T=24,RH=24,railMs=[toon({color:0xaaaaaa}),toon({color:COL[0]}),toon({color:COL[1]})];
  const rail=(w,d,x,z,m)=>{const r=sh(hull(new THREE.Mesh(new THREE.BoxGeometry(w,RH,d),m),3));r.position.set(x,RH/2,z);scene.add(r)};
  for(const s of [-1,1]){rail(T,FL/2+T,s*(FW/2+T/2),FL/4+T/2,railMs[1]);rail(T,FL/2+T,s*(FW/2+T/2),-FL/4-T/2,railMs[2])}
  const seg=(FW-GW)/2,sx=GW/2+seg/2;
  for(const [z,m] of [[-FL/2-T/2,railMs[2]],[FL/2+T/2,railMs[1]]])for(const s of [-1,1])rail(seg,T,s*sx,z,m);
  for(const z of [-FL/2-T/2,FL/2+T/2]){const m=new THREE.Mesh(new THREE.BoxGeometry(GW,2,T),new THREE.MeshBasicMaterial({color:0x000000}));m.position.set(0,0,z);scene.add(m)}
  // 四隅の丸み：レールと同じ色の階段状ブロック（当たり判定は半径 RC の円）
  {const CS=8;for(const [cx,cy,sx,sy] of CORNERS){const m=cy<MID?railMs[2]:railMs[1];
    for(let j=0;j<RC;j+=CS){const dy=RC-(j+CS/2),w=RC-Math.sqrt(Math.max(0,RC*RC-dy*dy));if(w<2)continue;
      rail(w,CS,(sx<0?w/2:FW-w/2)-FW/2,(sy<0?FY0+j+CS/2:FY1-j-CS/2)-MID,m)}}}
  // ゴールポスト（ゴール口の両端）：白い柱。当たると光る
  meshes.posts=[[FW/2-GW/2,FY0],[FW/2+GW/2,FY0],[FW/2-GW/2,FY1],[FW/2+GW/2,FY1]].map(([px,py])=>{const mm=toon({color:0xffffff});const b=sh(hull(new THREE.Mesh(new THREE.BoxGeometry(14,RH+10,14),mm),3));b.position.set(px-FW/2,(RH+10)/2,py-MID);scene.add(b);return mm});
  // マレット
  meshes.mallet=P.map((p,i)=>{
    const gr=new THREE.Group();
    const mA=toon({color:COL[i]}),mB=toon({color:DEEP[i]});gr.userData={mA,mB};
    const b=sh(hull(new THREE.Mesh(new THREE.CylinderGeometry(MR,MR,16,24),mA)));b.position.y=8;gr.add(b);
    const r=sh(new THREE.Mesh(new THREE.CylinderGeometry(MR*.62,MR*.7,4,24),mB));r.position.y=17;gr.add(r);
    const n=sh(hull(new THREE.Mesh(new THREE.CylinderGeometry(14,17,34,16),toon({color:0xffffff})),3));n.position.y=34;gr.add(n);
    const c=sh(hull(new THREE.Mesh(new THREE.SphereGeometry(17,16,8),mA),3));c.position.y=52;gr.add(c);
    scene.add(gr);return gr;
  });
  // パック
  const drawPuck=(q)=>{q.fillStyle=PK.b;q.fillRect(0,0,16,16);q.fillStyle=PK.r;for(let a=0;a<6.3;a+=.1)q.fillRect(Math.round(8+Math.cos(a)*5)-1,Math.round(8+Math.sin(a)*5)-1,2,2)};
  const pt=tex(16,16,drawPuck,true);
  const wm=toon({color:PK.b});
  const tm=toon({map:pt});meshes.puckMats=[wm,tm];
  meshes.puck=sh(hull(new THREE.Mesh(new THREE.CylinderGeometry(PR,PR,12,24),[wm,tm,wm])));scene.add(meshes.puck);
  // アイテムボックス
  const boxTex=[];
  meshes.box=P.map((p,i)=>{const drawBox=(q)=>{q.fillStyle=COL[i];q.fillRect(0,0,16,16);q.fillStyle='#000';q.fillRect(0,0,16,1);q.fillRect(0,15,16,1);q.fillRect(0,0,1,16);q.fillRect(15,0,1,16);

    const id='r'+d.id;
    if(d.t==='pm'){const q=NET.rseq.get(id);if(q!=null&&d.q<=q)return;NET.rseq.set(id,d.q)} // 順不同チャネル：古い入力は捨てる

  case 'start':clearMatch();mode='online';P=[mk(0),mk(1)];state='play';live=false;setFlip(true);_seq([523,659,784,1047,0,784,1047],.08);break;
  case 'lobby':if(mode==='online')toLobby();break;

  if(inR(l,BACK)){netReset();if(LOB.sub==='menu'){state='title'}else{LOB.sub='menu'}mode=mode==='online'?'cpu':mode;_beep(520,.05);return}
  if(LOB.sub==='menu'){
    if(inR(l,{x:70,y:TY0+120,w:220,h:90})){hostOpen();_beep(660,.05)}
    else if(inR(l,{x:310,y:TY0+120,w:220,h:90})){LOB.sub='join';LOB.input='';LOB.err=0;_beep(660,.05)}
  }else if(LOB.sub==='join'&&!LOB.busy){
    KEYPAD.forEach((k,j)=>{if(!inR(l,keyR(j)))return;
      if(k==='DEL'){LOB.input=LOB.input.slice(0,-1);_beep(400,.04)}

    if(inR(l,{x:200,y:TY0+130,w:200,h:110})){hostBegin()}

}

/* ================= 開発者画面（DEV）：FX STYLE × FX COLOR × FX LEVEL ごとのエフェクトの見え方を確認 =================
   OPTION の文字を2回連続タップで入る。上半分の盤面にエフェクトを出し、下半分のパネルで切り替える。抜けると元の設定に戻す */
const DEV={saved:null,last:'burst',loop:false,loopT:0,move:true,fast:false,slow:false,aura:false,stun:false,goal:false,a:0};
const DEV_FX=['impact','imp-wall','imp-tiny','wave','smash','speed','mud-in','mud-out','mud-bub','mud-drop','goal','spawn','fly','stop'];
const DEV_TG=['ALL','LOOP','MOVE','FAST','SLOW','AURA','STUN','GOAL','PARRY'];
const DEV_PAGES=['EFFECT','GAME'],devTab=k=>({x:110+k*118,y:MID+14,w:112,h:38}),DEV_RST={x:350,y:MID+14,w:112,h:38};
function devReset(){if((DEV.page|0)===1){Object.assign(PARC,PARC_DEF);saveParry();KEYS.forEach(k=>setIW(k,5))}else{TH.st=0;TH.fx=0;TH.lv=0;applyTheme()}} // 今のページの値を初期値に戻す // 開発者画面のページ：エフェクト／ゲーム設定
const DEV_ROWS=[[['st','FX STYLE'],['fx','FX COLOR'],['lv','FX LEVEL']],
  [['pw','PARRY WIN'],['pt','PARRY STOP'],['ps','PARRY SPD'],['i:jump','ITEM JUMP'],['i:boost','ITEM BOOST'],['i:bumper','ITEM BUMPER'],['i:mud','ITEM SLIME'],['i:super','ITEM SUPER']]],
  devRowY=k=>MID+62+k*34,DEV_GY=MID+176,devCell=k=>({x:30+(k%4)*135+4,y:DEV_GY+Math.floor(k/4)*38+2,w:127,h:34});
function devVal(key){if(key==='pw')return Math.round(PARC.w*1000)+'ms';if(key==='pt')return PARC.t.toFixed(2)+'s';if(key==='ps')return String(PARC.s);
  if(key.startsWith('i:')){const k=key.slice(2),tot=KEYS.reduce((a,q)=>a+IW[q],0);return IW[k]+'   '+(tot?Math.round(IW[k]/tot*100):Math.round(100/KEYS.length))+'%'}
  return THEMES[key][TH[key]].n}
function devStep(key,d){if(key==='pw')setParry('w',PARC.w+d*.005);else if(key==='pt')setParry('t',PARC.t+d*.05);else if(key==='ps')setParry('s',PARC.s+d*100);
  else if(key.startsWith('i:'))setIW(key.slice(2),IW[key.slice(2)]+d);
  else{const n=THEMES[key].length;TH[key]=(TH[key]+n+d)%n;applyTheme()}}
function enterDev(){DEV.saved=Object.assign({},TH);state='dev';fx.length=0;Object.assign(DEV,{loop:false,slow:false,aura:false,stun:false,goal:false,move:true,fast:false});P=[mk(0),mk(1)];beep(1320,.06);beep(1760,.06,'square',.06,.07)}
function exitDev(){Object.assign(TH,DEV.saved||TH);applyTheme();fx.length=0;drags.delete('dev');P=[mk(0),mk(1)];puck.sup=-1;Object.assign(puck,{x:FW/2,y:MID,vx:0,vy:0,trail:[]});ts=1;state='options';beep(660,.05)}
function devFire(k){
  const X=[120,240,360,480],Y=[250,340,430,520],c0=COL[0],c1=COL[1];
  const at=(k,x,y)=>{switch(k){
    case 'impact':addFx('impact',x,y,80,'','');break;
    case 'imp-wall':{const f=addFx('impact',FW,y,80,'','');if(f){f.nx=-1;f.ny=0}break}
    case 'imp-tiny':for(let n=0;n<4;n++)addFx('impact',x+rnd(-40,40),y+rnd(-30,30),8,'','');break;
    case 'wave':addFx('wave',x,y,120,'',c0);break;
    case 'smash':{const f=addFx('smash',x,y,1,'',c0);if(f)f.ang=-.9;break}
    case 'speed':{const f=addFx('speed',x,y,1);if(f){f.nx=.5;f.ny=-.87}break}
    case 'mud-in':addFx('mud',x,y,1,'in');break;case 'mud-out':addFx('mud',x,y,.6,'out');break;
    case 'mud-bub':for(let n=0;n<4;n++)addFx('mud',x+rnd(-40,40),y+rnd(-40,40),1,'bub');break;
    case 'mud-drop':for(let n=0;n<5;n++)addFx('mud',x+rnd(-10,10),y+n*10,1,'drop');break;
    case 'goal':addFx('goal',FW/2,FY0,1,'',c1);break;
    case 'spawn':addFx('spawn',x,y,1,'',c1);break;
    case 'fly':{const f=addFx('fly',x,y,1,'jump',c1),sl=local(1,slotX(0),SLOT_Y);if(f){f.tx=sl.u;f.ty=sl.v}break}
    case 'stop':stopCue(.09,c0);break}}; // stop は FX LEVEL が MIN のときだけ見える
  if(k==='ALL'){DEV_FX.forEach((q,n)=>at(q,X[n%4],Y[Math.floor(n/4)]))}else at(k,FW/2,380);
}
function devUpdate(dt){
  DEV.rstT=Math.max(0,(DEV.rstT||0)-dt);
  for(const f of fx)f.t+=dt;for(let k=fx.length-1;k>=0;k--)if(fx[k].t>fx[k].life)fx.splice(k,1);
  ts+=((DEV.slow?.15:1)-ts)*Math.min(1,dt*12);shake*=Math.exp(-dt*9);
  if(DEV.move){const w=DEV.fast?3.2:1.1,ox=puck.x,oy=puck.y;DEV.a+=dt*w;puck.x=FW/2+Math.cos(DEV.a)*200;puck.y=FY0+250+Math.sin(DEV.a*1.3)*130;puck.vx=(puck.x-ox)/dt;puck.vy=(puck.y-oy)/dt}
  else{puck.vx=puck.vy=0;puck.x=FW/2;puck.y=FY0+250}
  puck.trail.push({x:puck.x,y:puck.y,sp:Math.hypot(puck.vx,puck.vy)});if(puck.trail.length>10)puck.trail.shift();
  P[1].pw=DEV.aura;puck.sup=DEV.aura?0:-1;P[1].stun=DEV.stun?1:0;puck.par=DEV.parry?0:-1;puck.parT=2;
  if(DEV.slow)drags.set('dev',{i:1,slot:0,type:'bumper',x:FW/2+120,y:FY0+170,t:GRACE*(.4+.6*((clock*.4)%1))});else drags.delete('dev');
  if(DEV.loop){DEV.loopT-=dt;if(DEV.loopT<=0){DEV.loopT=1.3;devFire(DEV.last)}}
}
function devTap(l){
  if(inR(l,{x:36,y:MID+14,w:60,h:38})){exitDev();return}
  if(inR(l,DEV_RST)){devReset();seq([880,660,440],.04,'square',.05);DEV.rstT=.4;return}
  for(let k=0;k<DEV_PAGES.length;k++)if(inR(l,devTab(k))){if((DEV.page|0)!==k){DEV.page=k;beep(990,.04)}return}
  DEV_ROWS[DEV.page|0].forEach(([key],k)=>{const y=devRowY(k);if(l.v<y||l.v>y+30)return;
    const d=l.u>160&&l.u<230?-1:l.u>370&&l.u<440?1:0;if(d){devStep(key,d);beep(d<0?520:780,.04)}});
  if((DEV.page|0)!==0)return; // エフェクトの試し撃ちは EFFECT ページだけ
  const all=DEV_FX.concat(DEV_TG);all.forEach((k,n)=>{if(!inR(l,devCell(n)))return;beep(880,.03);
    if(k==='LOOP')DEV.loop=!DEV.loop;else if(k==='MOVE')DEV.move=!DEV.move;else if(k==='FAST')DEV.fast=!DEV.fast;else if(k==='SLOW')DEV.slow=!DEV.slow;
    else if(k==='AURA')DEV.aura=!DEV.aura;else if(k==='STUN')DEV.stun=!DEV.stun;else if(k==='GOAL')DEV.goal=!DEV.goal;else if(k==='PARRY')DEV.parry=!DEV.parry;
    else{DEV.last=k;DEV.loopT=1.3;devFire(k)}});
}
function drawDev(){
  if(DEV.goal){const ls=lastScorer,gt=goalT;lastScorer=0;goalT=1;g.save();g.translate(0,-380);drawGoalDeco();g.restore();lastScorer=ls;goalT=gt} // 見る人の向きで上半分に
  g.fillStyle='rgba(0,0,0,.7)';g.fillRect(-40,MID,FW+80,FL/2);
  frame(0,()=>{pbox(20,MID+8,FW-40,FL/2-12,YEL);ptext('DEV',FW-40,MID+26,8,YEL,PIX,'right');ptext('v'+VER,FW-40,MID+42,8,'#777',PIX,'right');
    {const r=DEV_RST,f=(DEV.rstT||0)>0;pbox(r.x,r.y,r.w,r.h,f?YEL:'#a33',f?'#332':'#000');ptext('RESET',r.x+r.w/2,r.y+20,11,f?YEL:'#f66')}
    pbox(36,MID+14,60,38,'#666');ptext('<',66,MID+34,16,'#fff');
    DEV_PAGES.forEach((n,k)=>{const r=devTab(k),on=(DEV.page|0)===k;pbox(r.x,r.y,r.w,r.h,on?YEL:'#555',on?'#332':'#000');ptext(n,r.x+r.w/2,r.y+20,11,on?YEL:'#888')});
    DEV_ROWS[DEV.page|0].forEach(([key,lab],k)=>{const y=devRowY(k);ptext(lab,40,y+17,8,'#888',PIX,'left');
      for(const [x,ch] of [[160,'<'],[370,'>']]){pbox(x,y,70,30,'#666');ptext(ch,x+35,y+17,14,'#fff')}
      ptext(devVal(key),FW/2,y+17,11,THEMES[key]?'#fff':YEL)});
    if((DEV.page|0)!==0)return;
    const on={LOOP:DEV.loop,MOVE:DEV.move,FAST:DEV.fast,SLOW:DEV.slow,AURA:DEV.aura,STUN:DEV.stun,GOAL:DEV.goal,PARRY:DEV.parry};
    DEV_FX.concat(DEV_TG).forEach((k,n)=>{const r=devCell(n),tg=k in on,act=tg?on[k]:k===DEV.last;
      pbox(r.x,r.y,r.w,r.h,act?(tg?YEL:'#fff'):(tg?'#555':'#777'),act&&tg?'#332':'#000');ptext(k.toUpperCase(),r.x+r.w/2,r.y+r.h/2+2,9,k==='stop'&&!minimal()?'#555':'#fff')});
  });
}

/* ================= 入力 ================= */
/* ctl(i)：いま処理している入力でプレイヤー i を操作してよいか
   CPU戦＝1Pのみ／オンライン＝ホスト端末は1P、ゲストから届いた入力（rctx）は2P／同じ端末の2P＝両方 */
const ctl=i=>mode==='cpu'?i===0:mode==='online'?(rctx?i===1:i===0):true;
function down(e){
  e.preventDefault();unlock();diagP={cx:e.clientX,cy:e.clientY};
  const {x,y}=toL(e.clientX,e.clientY);
  if(e.pointerType==='mouse'&&fsHit(x,y)){goFS();return}
  if(guestOn()){guestDown(e.pointerId,x,y);return}
  if(state==='lobby'){lobbyTap(local(0,x,y));return}
  noFwd=true;try{pdown(e.pointerId,x,y)}finally{noFwd=false}
}
let DIAG=false,diagT=0,diagP=null; // 隠し診断表示：タイトルの AIR HOCKEY を長押し
function pdown(id,x,y){
  if(state==='title'&&!rctx){const l=local(0,x,y);if(Math.abs(l.u-FW/2)<180&&Math.abs(l.v-(TY0+58))<34)diagT=performance.now()}
  if(rctx&&state!=='play'&&state!=='goal'&&state!=='over')return;
  if(state==='title'){const l=local(0,x,y);if(fsHit(x,y))return;if(inR(l,HOWB)){beep(880,.05);setTimeout(()=>{location.href='howto.html'},80);return}for(const b of BTN){const by=btnY(b);if(l.u>b.x&&l.u<b.x+b.w&&l.v>by&&l.v<by+BH){if(b.m==='opt'){state='options';beep(660,.05)}else if(b.m==='net'){if(window.Peer){state='lobby';LOB.sub='menu';beep(660,.05)}else{beep(150,.12)}}else start(b.m,b.l);return}}return}
  if(state==='options'){optTap(local(0,x,y),id);return}
  if(state==='dev'){devTap(local(0,x,y));return}
  if(state==='over'){if(overT>1.5){if(mode==='online'){toLobby()}else{state='title';placed.forEach(drop);placed=[];beep(660,.06)}}return}
  if(PAR.who>=0&&state==='play'){const i=PAR.who,p=P[i];if(ctl(i)&&(i===0?y>MID:y<MID)){if(p.ptr==null){p.ptr=id;aim(p,x,y)}return}} // 時間停止中：パリィした人は自分の側に指を置いて引っ張って狙う。守る側の指は下の通常処理でマレットを動かす
  if(state==='pause'){const i=y>MID?0:1;if(!pzShow(i)||!ctl(i))return;const h=pauseHit(i,x,y);if(h==='play')resumeGame();else if(h==='quit')quitGame();return}
  for(const i of [0,1]){
    const l=local(i,x,y);
    if(l.v>FY1){if(!ctl(i))return;if(inR(l,{x:PZB.x-8,y:PZB.y-8,w:PZB.w+16,h:PZB.h+16})){pauseGame();return}const s=slotAt(l.u,l.v);
      if(s>=0&&P[i].items[s]&&(SUP.aim>=0||PAR.who>=0))return; // 構え・パリィ停止中はアイテム欄を使わない
      if(s>=0&&P[i].items[s]&&!live){flashSlot(P[i],'#666',.3,s);beep(150,.1,'square',.06);return}
      if(s>=0&&P[i].items[s]==='super'){superOn(i,s);return} // タップで即使用
      if(s>=0&&P[i].items[s]){
        if(arm[i]){if(arm[i].slot!==s){flashSlot(P[i],'#666',.3,s);beep(150,.08,'square',.05);return}const a=arm[i];arm[i]=null;drags.set(id,{i,slot:s,type:a.type,x,y,t:a.t});return} // 選んだアイテムはキャンセル・持ち替えできない（もう一度触ると、残り時間のままドラッグに戻る）
        if(![...drags.values()].some(d=>d.i===i)){arm[i]=null;drags.set(id,{i,slot:s,type:P[i].items[s],x,y,t:GRACE});slide(200,600,.12,'square',.05)}}
      return}
  }
